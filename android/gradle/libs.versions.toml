[versions]
agp = "9.4.1"
# 2.0 alpha: detekt 1.23.8, the stable line, cannot run on the build JDK 25
# (its Kotlin rejects the JVM target, and its compiler cannot parse the JDK
# version string).
detekt = "2.0.0-alpha.6"
androidxActivityKtx = "1.13.0"
androidxAppcompat = "1.8.0"
androidxConstraintlayout = "2.2.2"
androidxCore = "1.19.1"
androidxPreference = "1.2.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
junit4 = "4.13.2"
kotest = "6.2.5"
kotlinxSerialization = "1.11.0"
kover = "0.9.11"
material = "1.14.0"
playServicesOssLicenses = "17.5.2"
robolectric = "4.17"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

[libraries]
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivityKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidxPreference" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
material = { module = "com.google.android.material:material", version.ref = "material" }
play-services-oss-licenses = { module = "com.google.android.gms:play-services-oss-licenses", version.ref = "playServicesOssLicenses" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
