R47_DEFAULT_ANDROID_APPLICATION_ID=io.github.ppigazzini.r47zen
# Two distinct JDK axes, deliberately separate keys.
#
# BUILD_JDK_VERSION is the JDK that runs Gradle, AGP, javac, the Kotlin
# compiler, and the JVM unit tests. It is the single source every consumer
# reads: the Gradle Java toolchain in android/app/build.gradle, the
# actions/setup-java steps in .github/workflows, and the doctor in
# scripts/android/build_android.sh. run_build_jdk_pin_coherence_contract.sh
# fails if any of them drifts from this value.
#
# JAVA_VERSION is the language and bytecode level the app itself is compiled
# to (sourceCompatibility, targetCompatibility, and the Kotlin jvmTarget AGP
# derives from them). It stays below the build JDK because it sets shipped
# bytecode, not because a compiler refuses more: the Kotlin compiler the
# catalog's `kotlin` names accepts the build JDK's level. 21 is the newest LTS
# level D8 and the shipped dex are proven on. Raising this key changes shipped
# bytecode and must be proven on the connected-device lane, not just on the
# host.
R47_DEFAULT_ANDROID_BUILD_JDK_VERSION=25
R47_DEFAULT_ANDROID_JAVA_VERSION=21
R47_DEFAULT_ANDROID_GRADLE_VERSION=9.8.2
R47_DEFAULT_ANDROID_AGP_VERSION=9.5.0
R47_DEFAULT_ANDROID_COMPILE_SDK=37
# Android minor SDK versions (37.1, 37.2, ...) add APIs inside one major
# API level. AGP expresses that as compileSdkMinor beside the integer
# compileSdk, and the platform package id carries it: compileSdk 37 with
# minor 2 installs platforms;android-37.2. There is no targetSdkMinor -- a
# minor is a compile-time surface only -- so R47_DEFAULT_ANDROID_TARGET_SDK
# stays the bare major and the shipped manifest is unchanged by this key.
R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR=2
R47_DEFAULT_ANDROID_TARGET_SDK=37
R47_DEFAULT_ANDROID_MIN_SDK=24
R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION=37.0.0
R47_DEFAULT_ANDROID_NDK_VERSION=30.0.16248370
R47_DEFAULT_ANDROID_CMAKE_VERSION=4.1.2
R47_DEFAULT_ANDROID_ABI_FILTERS=arm64-v8a
# The next production release: its Play version code and its version,
# major.minor.patch (SemVer). The release lane's confirm_version_code and
# confirm_version inputs must equal these two lines, the code must be the
# previous release's + 1, and scripts/android/check_release_version.sh holds
# the version to the bump rules in
# android/docs/dev/10-writing.md#version-numbers. A dev build is a pre-release
# of this version, <version>-<run>.<attempt>, with the run number as its code.
# Right after a release, a commit sets the next code and version.
R47_DEFAULT_ANDROID_VERSION_CODE=10
R47_DEFAULT_ANDROID_VERSION_NAME=0.1.13
R47_DEFAULT_ANDROID_TEST_API_LEVEL=36
R47_DEFAULT_ANDROID_TEST_ABI_FILTERS=arm64-v8a,x86_64
# SHA-256 of the certificate that signs every production release APK and AAB,
# lowercase hex as `apksigner verify --print-certs` prints it. The release
# lane's verify-signed-artifacts job fails a build signed by any other key,
# and README.md states the value for anyone who checks an APK by hand;
# run_published_artifacts_verifier_contract.sh holds the two equal. Rotating
# the signing key changes this line and the README in one commit.
R47_DEFAULT_RELEASE_SIGNER_CERT_SHA256=fa001b0b6a847335806c5ba5094a07c38b1962b0b983e1b07407bbe5628aacc6
# SHA-256 of the certificate that signs every published dev pre-release APK,
# in the same form. sign-dev-prerelease in android-ci.yml fails a push,
# schedule, or dispatch build signed by any other key; a pull request signs with
# a throwaway key and is not held to it. Rotating the dev key changes this line.
R47_DEFAULT_PRERELEASE_SIGNER_CERT_SHA256=3e205018f6b622fc382be665efec9c06c231d8f8aec2027e4014800573c43ab1
# JVM unit-test total line-coverage floor enforced by coverage_gate.sh. This is
# a maintainer-ratcheted floor, not an auto-ratchet: it sits just below the
# measured coverage so a regression fails the gate. Raise it (never lower it)
# when coverage rises durably. Measured 85.27% on 2026-09-28 with the
# android-tests task graph (:app:testReleaseUnitTest :app:koverXmlReportRelease
# on the dev channel).
R47_DEFAULT_COVERAGE_MIN_TOTAL_LINE_PERCENT=84
