R47_DEFAULT_ANDROID_APPLICATION_ID=io.github.ppigazzini.r47zen
# Two distinct JDK axes, deliberately separate keys.
#
# BUILD_JDK_VERSION is the JDK that runs Gradle, AGP, javac, the Kotlin
# compiler, and the JVM unit tests. It is the single source every consumer
# reads: the Gradle Java toolchain in android/app/build.gradle, the
# actions/setup-java steps in .github/workflows, and the doctor in
# scripts/android/build_android.sh. run_build_jdk_pin_coherence_contract.sh
# fails if any of them drifts from this value.
#
# JAVA_VERSION is the language and bytecode level the app itself is compiled
# to (sourceCompatibility, targetCompatibility, and the Kotlin jvmTarget AGP
# derives from them). It is capped well below the build JDK: the Kotlin
# compiler AGP 9.4.1 bundles rejects a jvmTarget above 24 ("Unknown Kotlin JVM
# target: 25"), so 25 is not reachable here, and 21 is the newest LTS level
# that the compiler, D8, and the shipped dex all accept. Raising this key
# changes shipped bytecode and must be proven on the connected-device lane,
# not just on the host.
R47_DEFAULT_ANDROID_BUILD_JDK_VERSION=25
R47_DEFAULT_ANDROID_JAVA_VERSION=21
R47_DEFAULT_ANDROID_GRADLE_VERSION=9.8.0
R47_DEFAULT_ANDROID_AGP_VERSION=9.4.1
R47_DEFAULT_ANDROID_COMPILE_SDK=37
# Android minor SDK versions (37.1, 37.2, ...) add APIs inside one major
# API level. AGP expresses that as compileSdkMinor beside the integer
# compileSdk, and the platform package id carries it: compileSdk 37 with
# minor 2 installs platforms;android-37.2. There is no targetSdkMinor -- a
# minor is a compile-time surface only -- so R47_DEFAULT_ANDROID_TARGET_SDK
# stays the bare major and the shipped manifest is unchanged by this key.
R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR=2
R47_DEFAULT_ANDROID_TARGET_SDK=37
R47_DEFAULT_ANDROID_MIN_SDK=24
R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION=37.0.0
R47_DEFAULT_ANDROID_NDK_VERSION=30.0.16248370
R47_DEFAULT_ANDROID_CMAKE_VERSION=4.1.2
R47_DEFAULT_ANDROID_ABI_FILTERS=arm64-v8a
R47_DEFAULT_ANDROID_VERSION_CODE=1
R47_DEFAULT_ANDROID_VERSION_NAME=0.1.0
R47_DEFAULT_ANDROID_TEST_API_LEVEL=34
R47_DEFAULT_ANDROID_TEST_ABI_FILTERS=arm64-v8a,x86_64
# JVM unit-test total line-coverage floor enforced by coverage_gate.sh. This is
# a maintainer-ratcheted floor, not an auto-ratchet: it sits just below the
# current measured coverage so a regression fails the gate. Bump it up (never
# down) when coverage rises durably. Measured 82.86% on 2026-07-05.
R47_DEFAULT_COVERAGE_MIN_TOTAL_LINE_PERCENT=82
R47_DEFAULT_XLSXIO_URL=https://github.com/brechtsanders/xlsxio.git
