// Turns the oss-licenses plugin's output, a byte blob (raw/third_party_licenses)
// and one "offset:length name" line per library
// (raw/third_party_license_metadata), into the asset index that
// RepoNoticeIndexActivity reads, one text file per library. The app shows
// every library's license text on its own screens, so it ships no license
// viewer: play-services-oss-licenses 17.5 brought Compose, Play services, and
// Guava into a View-based APK for one settings entry. The plugin writes a
// single placeholder entry for a debug variant.
abstract class GenerateLibraryLicenseAssets extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getLicensesDirectory()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def rawDir = licensesDirectory.dir('raw').get().asFile
        byte[] blob = new File(rawDir, 'third_party_licenses').bytes
        def metadataLines = new File(rawDir, 'third_party_license_metadata')
            .getText('UTF-8')
            .readLines()
            .findAll { !it.trim().isEmpty() }
        if (metadataLines.isEmpty()) {
            throw new GradleException("The oss-licenses plugin listed no library in ${rawDir}")
        }

        def indexDir = outputDir.dir('library-licenses').get().asFile
        indexDir.deleteDir()
        indexDir.mkdirs()
        def entries = []
        metadataLines.eachWithIndex { String line, int index ->
            // The offsets count bytes, not characters: the blob is UTF-8.
            def matcher = line =~ /^(\d+):(\d+) (.+)$/
            if (!matcher.matches()) {
                throw new GradleException("Unreadable oss-licenses metadata line: ${line}")
            }
            int start = matcher.group(1) as int
            int length = matcher.group(2) as int
            if (start + length > blob.length) {
                throw new GradleException("oss-licenses metadata points past the license text: ${line}")
            }
            def assetName = String.format(Locale.ROOT, '%03d.txt', index)
            new File(indexDir, assetName).bytes = Arrays.copyOfRange(blob, start, start + length)
            entries << [
                title      : matcher.group(3),
                summary    : '',
                assetPath  : "library-licenses/${assetName}".toString(),
                contentType: 'text/plain'
            ]
        }
        new File(indexDir, 'NOTICE-INDEX.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion: 1,
            title        : 'Android library licenses',
            entries      : entries
        ])) + '\n'
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def licensesTask = tasks.named("${variant.name}OssLicensesTask", LicensesTask)
        def libraryLicenseAssets = tasks.register("generate${variant.name.capitalize()}LibraryLicenseAssets", GenerateLibraryLicenseAssets) { task ->
            task.licensesDirectory.set(licensesTask.flatMap { it.generatedDirectory })
        }
        variant.sources.assets?.addGeneratedSourceDirectory(libraryLicenseAssets) { it.outputDir }

        variant.deviceTests.values().each { deviceTest ->
            deviceTest.sources.assets?.addGeneratedSourceDirectory(stageProgramFixtureAssets) { it.outputDir }
        }
    }
}

tasks.register('generateRepoNoticeAssets') {
    inputs.file(repoNoticeInventoryFile)
    repoNoticeInventory.components.each { component ->
        inputs.file(resolveRepoNoticeSourceFile(component as Map))
    }
    outputs.dir("${generatedComplianceAssetsDir}/repo-notices")

    def generatedAssetsDir = file(generatedComplianceAssetsDir)
    doLast {
        def repoAssetsDir = new File(generatedAssetsDir, 'repo-notices')
        repoAssetsDir.deleteDir()
        repoAssetsDir.mkdirs()

        def indexEntries = []
        repoNoticeInventory.components.each { rawComponent ->
            def component = rawComponent as Map
            def sourceFile = resolveRepoNoticeSourceFile(component)
            if (!sourceFile.isFile()) {
                throw new GradleException("Missing repo notice source file: ${sourceFile}")
            }

            def assetPath = component.assetPath?.toString()?.trim()
            if (!assetPath) {
                throw new GradleException("Repo notice component is missing assetPath: ${component}")
            }

            def targetFile = new File(generatedAssetsDir, assetPath)
            targetFile.parentFile.mkdirs()
            targetFile.bytes = sourceFile.bytes

            indexEntries << [
                id              : component.id,
                title           : component.title,
                summary         : component.summary,
                assetPath       : assetPath,
                contentType     : component.contentType ?: 'text/plain',
                declaredLicense : component.declaredLicense ?: 'NOASSERTION'
            ]
        }

        def indexFile = new File(repoAssetsDir, 'NOTICE-INDEX.json')
        indexFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion : repoNoticeInventory.schemaVersion ?: 1,
            title         : repoNoticeInventory.title ?: 'R47 repo-owned notices',
            entries       : indexEntries
        ])) + '\n'
    }
}

tasks.register('generateXlsxioLicense') {
    inputs.file(xlsxioLicenseSourceFile)
    inputs.property('xlsxioSourceRepositoryUrl', xlsxioSourceRepositoryUrl ?: '')
    inputs.property('xlsxioSourceCommit', xlsxioSourceCommit ?: '')
    outputs.file("${generatedComplianceAssetsDir}/LICENSE.txt")

    def generatedAssetsDir = file(generatedComplianceAssetsDir)
    doLast {
        generatedAssetsDir.mkdirs()
        new File(generatedAssetsDir, 'LICENSE.txt').bytes = xlsxioLicenseSourceFile.bytes
    }
}

// The third-party SPDX package list, as a provider generateThirdPartySpdx
// takes as an input. Gradle evaluates it only when a build schedules that task,
// after the project is configured, and the configuration-cache entry stores the
// plain strings and maps it returns. An afterEvaluate block here resolved
// releaseRuntimeClasspath and read every dependency's POM while configuring
// every build, `help` included, which Gradle reports as "resolved during
// configuration time".
def spdxRuntimePackages = providers.provider {
    def packages = []
    def addSpdxPackage = { Map values ->
        packages << createSpdxPackage(values)
    }

    addSpdxPackage([
        SPDXID          : toSpdxRef('r47zen-source'),
        name            : 'r47zen',
        downloadLocation: androidSourceRepositoryUrl ?: 'NOASSERTION',
        licenseDeclared : 'GPL-3.0-only',
        versionInfo     : androidSourceCommit ?: 'unknown',
        summary         : 'Android fork source repository for the packaged R47 application.',
        sourceInfo      : 'Recorded from the local Git checkout used for this build.'
    ])

    if (upstreamSourceRepositoryUrl && upstreamSourceCommit) {
        addSpdxPackage([
            SPDXID          : toSpdxRef('r47-upstream-core'),
            name            : 'r47-upstream-core',
            downloadLocation: upstreamSourceRepositoryUrl,
            licenseDeclared : 'GPL-3.0-only',
            versionInfo     : upstreamSourceCommit,
            summary         : 'Authoritative upstream core revision synchronized into the Android build.',
            sourceInfo      : 'Recorded from the synchronized upstream core metadata for this build.'
        ])
    }

    addSpdxPackage([
        SPDXID          : toSpdxRef('xlsxio'),
        name            : 'xlsxio',
        downloadLocation: xlsxioSourceRepositoryUrl ?: 'NOASSERTION',
        licenseDeclared : 'MIT',
        versionInfo     : xlsxioSourceCommit ?: 'unknown',
        summary         : 'Vendored spreadsheet I/O dependency packaged with the Android build.',
        sourceInfo      : 'Version and source URL come from the shared Android defaults or explicit build properties.'
    ])

    addSpdxPackage([
        SPDXID          : toSpdxRef('decnumbericu'),
        name            : 'decNumberICU',
        downloadLocation: 'NOASSERTION',
        licenseDeclared : 'ICU',
        summary         : 'Vendored decimal arithmetic sources under dep/decNumberICU.',
        sourceInfo      : 'Notice source is hydrated from upstream at dep/decNumberICU/ICU-license.html during the build.'
    ])

    addSpdxPackage([
        SPDXID          : toSpdxRef('mini-gmp-fallback'),
        name            : 'mini-gmp fallback',
        downloadLocation: 'https://gmplib.org/',
        licenseDeclared : 'LGPL-3.0-or-later OR GPL-2.0-or-later',
        summary         : 'Fallback big integer implementation under android/compat/mini-gmp-fallback.',
        sourceInfo      : 'Notice text is recorded in the repo-owned notice inventory.'
    ])

    def runtimeConfiguration = configurations.findByName('releaseRuntimeClasspath') ?: configurations.findByName('debugRuntimeClasspath')
    if (runtimeConfiguration != null) {
        def runtimeModules = runtimeConfiguration.incoming.resolutionResult.allComponents
            .collect { it.id }
            .findAll { it instanceof ModuleComponentIdentifier }
            .unique { id -> "${id.group}:${id.module}:${id.version}" }
            .sort { left, right ->
                "${left.group}:${left.module}:${left.version}" <=> "${right.group}:${right.module}:${right.version}"
            }

        runtimeModules.each { ModuleComponentIdentifier moduleId ->
            def licenses = []
            def pomUrl = null

            try {
                def pomConfiguration = configurations.detachedConfiguration(
                    dependencies.create("${moduleId.group}:${moduleId.module}:${moduleId.version}@pom")
                )
                pomConfiguration.transitive = false
                def pomFile = pomConfiguration.singleFile
                def pom = new XmlSlurper(false, false).parse(pomFile)
                licenses = pom.licenses.license.collect { licenseNode ->
                    [
                        name: licenseNode.name.text()?.trim(),
                        url : licenseNode.url.text()?.trim()
                    ]
                }
                pomUrl = pom.url.text()?.trim()
            } catch (Exception ignored) {
                licenses = []
            }

            def knownSpdxLicenses = licenses.collect { license ->
                mapPomLicenseToSpdx(license.name as String, license.url as String)
            }.findAll { it }.unique()

            def rawLicenseSummary = licenses.collect { license ->
                [license.name, license.url].findAll { it }.join(' - ')
            }.findAll { it }.join('; ')

            addSpdxPackage([
                SPDXID          : toSpdxRef("maven-${moduleId.group}-${moduleId.module}-${moduleId.version}".toString()),
                name            : "${moduleId.group}:${moduleId.module}".toString(),
                downloadLocation: "https://repo1.maven.org/maven2/${moduleId.group.replace('.', '/')}/${moduleId.module}/${moduleId.version}".toString(),
                licenseDeclared : knownSpdxLicenses.size() == 1 ? knownSpdxLicenses[0] : 'NOASSERTION',
                versionInfo     : moduleId.version.toString(),
                homepage        : pomUrl ?: null,
                summary         : "Android runtime dependency ${moduleId.group}:${moduleId.module}:${moduleId.version}.".toString(),
                licenseComments : rawLicenseSummary ?: 'License metadata was not available in the resolved POM.',
                sourceInfo      : 'Collected from the resolved runtime classpath and each dependency POM.',
                externalRefs    : [[
                    referenceCategory: 'PACKAGE-MANAGER',
                    referenceType    : 'purl',
                    referenceLocator : "pkg:maven/${moduleId.group}/${moduleId.module}@${moduleId.version}".toString()
                ]]
            ])
        }
    }
    packages
}

// The SPDX creation time is the source commit's, not the clock's, so two
// builds of one commit package the same bytes; SOURCE_DATE_EPOCH, the
// reproducible-builds convention, overrides it.
def spdxCreatedEpochSeconds = (System.getenv('SOURCE_DATE_EPOCH')
    ?: readGitOutput(['show', '-s', '--format=%ct', androidSourceCommit])
    ?: '0').toLong()

tasks.register('generateThirdPartySpdx') {
    inputs.file(repoNoticeInventoryFile)
    repoNoticeInventory.components.each { component ->
        inputs.file(resolveRepoNoticeSourceFile(component as Map))
    }
    inputs.property('androidSourceRepositoryUrl', androidSourceRepositoryUrl ?: '')
    inputs.property('androidSourceCommit', androidSourceCommit ?: '')
    inputs.property('upstreamSourceRepositoryUrl', upstreamSourceRepositoryUrl ?: '')
    inputs.property('upstreamSourceCommit', upstreamSourceCommit ?: '')
    inputs.property('xlsxioSourceRepositoryUrl', xlsxioSourceRepositoryUrl ?: '')
    inputs.property('xlsxioSourceCommit', xlsxioSourceCommit ?: '')

    def spdxAssetsDir = file(generatedComplianceAssetsDir)
    def spdxOutputFile = new File(spdxAssetsDir, 'THIRD-PARTY.spdx.json')
    outputs.file(spdxOutputFile)

    inputs.property('spdxPackages', spdxRuntimePackages)
    inputs.property('spdxCreatedEpochSeconds', spdxCreatedEpochSeconds)

    def documentSourceCommit = androidSourceCommit
    def documentPackages = spdxRuntimePackages
    def documentCreated = new Date(spdxCreatedEpochSeconds * 1000L).format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))

    doLast {
        spdxAssetsDir.mkdirs()
        def packages = documentPackages.get()

        def spdxDocument = [
            spdxVersion      : 'SPDX-2.3',
            dataLicense      : 'CC0-1.0',
            SPDXID           : 'SPDXRef-DOCUMENT',
            name             : 'R47 Android third-party inventory',
            documentNamespace: "https://r47.invalid/spdx/android/${documentSourceCommit ?: 'unknown'}".toString(),
            creationInfo     : [
                created : documentCreated,
                creators: ['Tool: Gradle generateThirdPartySpdx task']
            ],
            documentDescribes: packages.collect { it.SPDXID },
            packages         : packages
        ]

        spdxOutputFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(spdxDocument)) + '\n'
    }
}

tasks.register('generateSourceManifest') {
    inputs.property('androidSourceRepositoryUrl', androidSourceRepositoryUrl ?: '')
    inputs.property('androidSourceCommit', androidSourceCommit ?: '')
    inputs.property('upstreamSourceRepositoryUrl', upstreamSourceRepositoryUrl ?: '')
    inputs.property('upstreamSourceCommit', upstreamSourceCommit ?: '')
    inputs.property('xlsxioSourceRepositoryUrl', xlsxioSourceRepositoryUrl ?: '')
    inputs.property('xlsxioSourceCommit', xlsxioSourceCommit ?: '')
    outputs.file("${generatedComplianceAssetsDir}/SOURCE")

    def generatedAssetsDir = file(generatedComplianceAssetsDir)
    doLast {
        generatedAssetsDir.mkdirs()
        def sourceLines = []

        if (upstreamSourceRepositoryUrl && upstreamSourceCommit) {
            sourceLines << "upstream_url=${upstreamSourceRepositoryUrl}"
            sourceLines << "upstream_commit=${upstreamSourceCommit}"
        }

        sourceLines << "android_source_repository_url=${androidSourceRepositoryUrl}"
        sourceLines << "android_source_commit=${androidSourceCommit}"
        sourceLines << "xlsxio_url=${xlsxioSourceRepositoryUrl}"
        sourceLines << "xlsxio_commit=${xlsxioSourceCommit}"

        new File(generatedAssetsDir, 'SOURCE').text = sourceLines.join('\n') + '\n'
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyGplLicense')
    dependsOn tasks.named('generateRuntimeFontAssets')
    dependsOn tasks.named('generateRepoNoticeAssets')
    dependsOn tasks.named('generateThirdPartySpdx')
    dependsOn tasks.named('generateXlsxioLicense')
    dependsOn tasks.named('generateSourceManifest')
}

// detekt runs its default rule set over the Kotlin sources. The baseline holds
// the findings the code carried when detekt was adopted; any new finding fails
// :app:detekt. scripts/android/run_detekt.sh also fails when a baseline entry
// no longer matches a finding, so fixing one forces its removal and the
// baseline only shrinks.
detekt {
    buildUponDefaultConfig = true
    baseline = file('detekt-baseline.xml')
}
