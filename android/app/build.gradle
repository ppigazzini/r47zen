tasks.register('generateRuntimeFontAssets') {
    runtimeFontAssetNames.each { fontName ->
        inputs.file(new File(runtimeFontSourceDir, fontName))
    }
    outputs.dir(generatedRuntimeAssetsDir)

    def generatedAssetsDir = file(generatedRuntimeAssetsDir)
    doLast {
        def fontsDir = new File(generatedAssetsDir, 'fonts')
        if (runtimeFontSourceDir.canonicalFile == fontsDir.canonicalFile) {
            return
        }
        fontsDir.deleteDir()
        fontsDir.mkdirs()

        runtimeFontAssetNames.each { fontName ->
            def sourceFile = new File(runtimeFontSourceDir, fontName)
            def targetFile = new File(fontsDir, fontName)
            targetFile.bytes = sourceFile.bytes
        }
    }
}

// Stages the upstream PROGRAMS fixtures the instrumented tests load into
// program-fixtures/PROGRAMS. The output joins the androidTest assets only (see
// androidComponents below), so no app APK carries the fixtures and a lint,
// unit-test, or assemble run never stages them. Without an explicit commit the
// script reads upstream.lock, or resolves the latest upstream and writes the
// lock, so the lock is an input.
abstract class StageProgramFixtureAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getStagingInputs()

    @Input
    abstract Property<String> getUpstreamUrl()

    @Input
    abstract Property<String> getUpstreamCommit()

    @Internal
    abstract DirectoryProperty getRepositoryRoot()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void stage() {
        def root = repositoryRoot.get().asFile
        def command = [
            'bash',
            new File(root, 'scripts/android/stage_program_fixture_assets.sh').absolutePath,
            '--output-dir',
            outputDir.dir('program-fixtures').get().asFile.absolutePath,
        ]
        if (upstreamUrl.get() && upstreamCommit.get()) {
            command += [
                '--upstream-source-repository-url',
                upstreamUrl.get(),
                '--upstream-source-commit',
                upstreamCommit.get(),
            ]
        }
        execOperations.exec { spec ->
            spec.workingDir(root)
            spec.commandLine(command)
        }
    }
}

def stageProgramFixtureAssets = tasks.register('stageProgramFixtureAssets', StageProgramFixtureAssets) { task ->
    task.description = 'Stage the canonical upstream PROGRAMS fixtures into the androidTest assets.'
    task.stagingInputs.from(
        new File(repositoryRootDir, 'upstream.source'),
        new File(repositoryRootDir, 'upstream.lock'),
        new File(repositoryRootDir, 'scripts/upstream-sync/upstream.sh'),
        new File(repositoryRootDir, 'scripts/android/stage_program_fixture_assets.sh'),
    )
    task.upstreamUrl.set(upstreamSourceRepositoryUrl ?: '')
    task.upstreamCommit.set(upstreamSourceCommit ?: '')
    task.repositoryRoot.set(repositoryRootDir)
}

// Turns the oss-licenses plugin's output, a byte blob (raw/third_party_licenses)
// and one "offset:length name" line per library
// (raw/third_party_license_metadata), into the asset index that
// RepoNoticeIndexActivity reads, one text file per library. The app shows
// every library's license text on its own screens, so it ships no license
// viewer: play-services-oss-licenses 17.5 brought Compose, Play services, and
// Guava into a View-based APK for one settings entry. The plugin writes a
// single placeholder entry for a debug variant.
//
// For most Maven dependencies the plugin's entry is only the Apache 2.0 URL. A
// library whose entry is that URL gets the license itself, one shared copy of
// the tracked apache-2.0.txt; any other entry that is only a link fails the
// task, so a license never ships as a web address.
abstract class GenerateLibraryLicenseAssets extends DefaultTask {
    private static final String APACHE_ASSET = 'apache-2.0.txt'
    private static final java.util.regex.Pattern APACHE_LINK =
        ~/https?:\/\/www\.apache\.org\/licenses\/LICENSE-2\.0(\.txt|\.html)?/
    private static final java.util.regex.Pattern BARE_LINK = ~/https?:\/\/\S+/

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getLicensesDirectory()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getApacheLicenseText()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def rawDir = licensesDirectory.dir('raw').get().asFile
        byte[] blob = new File(rawDir, 'third_party_licenses').bytes
        def metadataLines = new File(rawDir, 'third_party_license_metadata')
            .getText('UTF-8')
            .readLines()
            .findAll { !it.trim().isEmpty() }
        if (metadataLines.isEmpty()) {
            throw new GradleException("The oss-licenses plugin listed no library in ${rawDir}")
        }

        def indexDir = outputDir.dir('library-licenses').get().asFile
        indexDir.deleteDir()
        indexDir.mkdirs()
        def entries = []
        metadataLines.eachWithIndex { String line, int index ->
            // The offsets count bytes, not characters: the blob is UTF-8.
            def matcher = line =~ /^(\d+):(\d+) (.+)$/
            if (!matcher.matches()) {
                throw new GradleException("Unreadable oss-licenses metadata line: ${line}")
            }
            int start = matcher.group(1) as int
            int length = matcher.group(2) as int
            if (start + length > blob.length) {
                throw new GradleException("oss-licenses metadata points past the license text: ${line}")
            }
            byte[] licenseBytes = Arrays.copyOfRange(blob, start, start + length)
            def licenseText = new String(licenseBytes, 'UTF-8').trim()
            def assetName
            if (APACHE_LINK.matcher(licenseText).matches()) {
                assetName = APACHE_ASSET
                def apacheFile = new File(indexDir, APACHE_ASSET)
                if (!apacheFile.exists()) {
                    apacheFile.bytes = apacheLicenseText.get().asFile.bytes
                }
            } else if (BARE_LINK.matcher(licenseText).matches()) {
                throw new GradleException(
                    "The license of ${matcher.group(3)} is only a link, ${licenseText}: track its text " +
                        "under android/compliance/repo-notices/source-texts and map the link to it here"
                )
            } else {
                assetName = String.format(Locale.ROOT, '%03d.txt', index)
                new File(indexDir, assetName).bytes = licenseBytes
            }
            entries << [
                title      : matcher.group(3),
                summary    : '',
                assetPath  : "library-licenses/${assetName}".toString(),
                contentType: 'text/plain'
            ]
        }
        new File(indexDir, 'NOTICE-INDEX.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion: 1,
            title        : 'Android library licenses',
            entries      : entries
        ])) + '\n'
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def licensesTask = tasks.named("${variant.name}OssLicensesTask", LicensesTask)
        def libraryLicenseAssets = tasks.register("generate${variant.name.capitalize()}LibraryLicenseAssets", GenerateLibraryLicenseAssets) { task ->
            task.licensesDirectory.set(licensesTask.flatMap { it.generatedDirectory })
            task.apacheLicenseText.set(
                rootProject.layout.projectDirectory.file('compliance/repo-notices/source-texts/apache-2.0.txt')
            )
        }
        variant.sources.assets?.addGeneratedSourceDirectory(libraryLicenseAssets) { it.outputDir }

        variant.deviceTests.values().each { deviceTest ->
            deviceTest.sources.assets?.addGeneratedSourceDirectory(stageProgramFixtureAssets) { it.outputDir }
        }
    }
}

tasks.register('generateRepoNoticeAssets') {
    inputs.file(repoNoticeInventoryFile)
    repoNoticeInventory.components.each { component ->
        inputs.file(resolveRepoNoticeSourceFile(component as Map))
    }
    outputs.dir("${generatedComplianceAssetsDir}/repo-notices")

    def generatedAssetsDir = file(generatedComplianceAssetsDir)
    doLast {
        def repoAssetsDir = new File(generatedAssetsDir, 'repo-notices')
        repoAssetsDir.deleteDir()
        repoAssetsDir.mkdirs()

        def indexEntries = []
        repoNoticeInventory.components.each { rawComponent ->
            def component = rawComponent as Map
            def sourceFile = resolveRepoNoticeSourceFile(component)
            if (!sourceFile.isFile()) {
                throw new GradleException("Missing repo notice source file: ${sourceFile}")
            }

            def assetPath = component.assetPath?.toString()?.trim()
            if (!assetPath) {
                throw new GradleException("Repo notice component is missing assetPath: ${component}")
            }

            def targetFile = new File(generatedAssetsDir, assetPath)
            targetFile.parentFile.mkdirs()
            targetFile.bytes = sourceFile.bytes

            indexEntries << [
                id              : component.id,
                title           : component.title,
                summary         : component.summary,
                assetPath       : assetPath,
                contentType     : component.contentType ?: 'text/plain',
                declaredLicense : component.declaredLicense ?: 'NOASSERTION'
            ]
        }

        def indexFile = new File(repoAssetsDir, 'NOTICE-INDEX.json')
        indexFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            schemaVersion : repoNoticeInventory.schemaVersion ?: 1,
            title         : repoNoticeInventory.title ?: 'R47 repo-owned notices',
            entries       : indexEntries
        ])) + '\n'
    }
}

tasks.register('generateXlsxioLicense') {
    inputs.file(xlsxioLicenseSourceFile)
    inputs.property('xlsxioSourceRepositoryUrl', xlsxioSourceRepositoryUrl ?: '')
    inputs.property('xlsxioSourceCommit', xlsxioSourceCommit ?: '')
    outputs.file("${generatedComplianceAssetsDir}/LICENSE.txt")

    def generatedAssetsDir = file(generatedComplianceAssetsDir)
    doLast {
        generatedAssetsDir.mkdirs()
        new File(generatedAssetsDir, 'LICENSE.txt').bytes = xlsxioLicenseSourceFile.bytes
    }
}

// Each runtime module's repository, by the group list settings.gradle filters
// Google's repository with: SPDX and purl name where the bytes came from, and
// Maven Central holds none of Google's groups. Central's address is the
// one mavenCentral() resolves from.
def googleMavenGroups = gradle.ext.r47GoogleMavenGroups as List<String>
def mavenRepositoryUrlFor = { String group ->
    googleMavenGroups.any { group == it || group.startsWith("${it}.") } ?
        'https://dl.google.com/dl/android/maven2' : 'https://repo.maven.apache.org/maven2'
}
// The file each module was verified as and its SHA-256, from the dependency
// verification metadata Gradle holds every download to: the inventory names the
// bytes the build took, with no download of its own.
def verificationMetadataText = providers.fileContents(
    rootProject.layout.projectDirectory.file('gradle/verification-metadata.xml')
).asText
// decNumber states its version in the source the core compiles.
def decNumberLocalHeaderText = providers.fileContents(
    objects.fileProperty().fileValue(new File(repositoryRootDir, 'dep/decNumberICU/decNumberLocal.h'))
).asText

// The third-party SPDX packages and relationships, as a provider
// generateThirdPartySpdx takes as an input. Gradle evaluates it only when a build
// schedules that task, after the project is configured, and the
// configuration-cache entry stores the plain strings and maps it returns. An
// afterEvaluate block here resolved releaseRuntimeClasspath and read every
// dependency's POM while configuring every build, `help` included, which Gradle
// reports as "resolved during configuration time".
def spdxRuntimeInventory = providers.provider {
    def packages = []
    def relationships = []
    def addSpdxPackage = { Map values ->
        packages << createSpdxPackage(values)
    }
    def relate = { String from, String type, String to ->
        relationships << [spdxElementId: from, relationshipType: type, relatedSpdxElement: to]
    }
    def appRef = toSpdxRef('r47zen-source')
    def upstreamCoreRef = toSpdxRef('r47-upstream-core')

    addSpdxPackage([
        SPDXID          : appRef,
        name            : 'r47zen',
        downloadLocation: androidSourceRepositoryUrl ?: 'NOASSERTION',
        licenseDeclared : 'GPL-3.0-only',
        versionInfo     : androidSourceCommit ?: 'unknown',
        summary         : 'Android fork source repository for the packaged R47 application.',
        sourceInfo      : 'Recorded from the local Git checkout used for this build.'
    ])
    relate('SPDXRef-DOCUMENT', 'DESCRIBES', appRef)

    addSpdxPackage([
        SPDXID          : upstreamCoreRef,
        name            : 'r47-upstream-core',
        downloadLocation: upstreamSourceRepositoryUrl ?: 'NOASSERTION',
        licenseDeclared : 'GPL-3.0-only',
        versionInfo     : upstreamSourceCommit ?: 'unknown',
        summary         : 'Authoritative upstream core revision synchronized into the Android build.',
        sourceInfo      : 'Recorded from the synchronized upstream core metadata for this build.'
    ])
    relate(appRef, 'DEPENDS_ON', upstreamCoreRef)

    def decNumberVersion = (decNumberLocalHeaderText.get() =~ /#define\s+DECVERSION\s+"decNumber ([0-9.]+)"/).with {
        it.find() ? it.group(1) : null
    }
    if (!decNumberVersion) {
        throw new GradleException('dep/decNumberICU/decNumberLocal.h states no DECVERSION "decNumber <version>".')
    }
    addSpdxPackage([
        SPDXID          : toSpdxRef('decnumbericu'),
        name            : 'decNumberICU',
        downloadLocation: 'NOASSERTION',
        licenseDeclared : 'ICU',
        versionInfo     : decNumberVersion,
        summary         : 'Decimal arithmetic the upstream core carries under dep/decNumberICU.',
        sourceInfo      : 'Version from DECVERSION in dep/decNumberICU/decNumberLocal.h; the notice is dep/decNumberICU/ICU-license.html.'
    ])
    relate(upstreamCoreRef, 'CONTAINS', toSpdxRef('decnumbericu'))

    addSpdxPackage([
        SPDXID          : toSpdxRef('pcg-basic'),
        name            : 'PCG Random Number Generation for C',
        downloadLocation: 'git+https://github.com/imneme/pcg-c-basic.git',
        homepage        : 'https://www.pcg-random.org',
        licenseDeclared : 'Apache-2.0',
        copyrightText   : "Copyright 2014 Melissa O'Neill <oneill@pcg-random.org>",
        summary         : 'Random number generator the upstream core carries as src/c47/mathematics/pcg_basic.c and pcg_basic.h.',
        sourceInfo      : 'The upstream core modified these files from pcg-c-basic, which has no release version.'
    ])
    relate(upstreamCoreRef, 'CONTAINS', toSpdxRef('pcg-basic'))

    addSpdxPackage([
        SPDXID          : toSpdxRef('mini-gmp-fallback'),
        name            : 'mini-gmp fallback',
        downloadLocation: 'https://gmplib.org/download/gmp/gmp-6.2.1.tar.bz2',
        licenseDeclared : 'LGPL-3.0-or-later OR GPL-2.0-or-later',
        versionInfo     : '6.2.1',
        summary         : 'Big integer arithmetic the app builds from android/compat/mini-gmp-fallback.',
        sourceInfo      : "mini-gmp from GMP 6.2.1, modified here to hand the core's allocation hooks each block's size."
    ])
    relate(appRef, 'DEPENDS_ON', toSpdxRef('mini-gmp-fallback'))

    addSpdxPackage([
        SPDXID          : toSpdxRef('xlsxio'),
        name            : 'xlsxio',
        downloadLocation: xlsxioSourceRepositoryUrl ?: 'NOASSERTION',
        licenseDeclared : 'MIT',
        versionInfo     : xlsxioSourceCommit ?: 'unknown',
        summary         : "Host tool (xlsxio_xlsx2csv) the build runs for upstream's font generation; none of its code ships in the app.",
        sourceInfo      : 'Version and source URL come from the shared Android defaults or explicit build properties.'
    ])
    relate(toSpdxRef('xlsxio'), 'BUILD_TOOL_OF', appRef)

    def runtimeConfiguration = configurations.findByName('releaseRuntimeClasspath') ?: configurations.findByName('debugRuntimeClasspath')
    if (runtimeConfiguration != null) {
        def verifiedArtifacts = [:]
        new XmlSlurper(false, false).parseText(verificationMetadataText.get()).components.component.each { component ->
            verifiedArtifacts["${component.@group}:${component.@name}:${component.@version}".toString()] =
                component.artifact.collect { artifact ->
                    [name: artifact.@name.toString(), sha256: artifact.sha256.@value.toString()]
                }
        }
        def mavenRef = { ModuleComponentIdentifier moduleId ->
            toSpdxRef("maven-${moduleId.group}-${moduleId.module}-${moduleId.version}".toString())
        }
        def resolution = runtimeConfiguration.incoming.resolutionResult
        def runtimeModules = resolution.allComponents
            .collect { it.id }
            .findAll { it instanceof ModuleComponentIdentifier }
            .unique { id -> "${id.group}:${id.module}:${id.version}" }
            .sort { left, right ->
                "${left.group}:${left.module}:${left.version}" <=> "${right.group}:${right.module}:${right.version}"
            }

        runtimeModules.each { ModuleComponentIdentifier moduleId ->
            def coordinates = "${moduleId.group}:${moduleId.module}:${moduleId.version}".toString()
            // A module that failed its POM read fails the build: a shipped
            // NOASSERTION would hide it.
            def pom
            try {
                def pomConfiguration = configurations.detachedConfiguration(
                    dependencies.create("${coordinates}@pom")
                )
                pomConfiguration.transitive = false
                pom = new XmlSlurper(false, false).parse(pomConfiguration.singleFile)
            } catch (Exception failure) {
                throw new GradleException("Could not read the POM of runtime module ${coordinates}.", failure)
            }
            def licenses = pom.licenses.license.collect { licenseNode ->
                [
                    name: licenseNode.name.text()?.trim(),
                    url : licenseNode.url.text()?.trim()
                ]
            }
            def pomUrl = pom.url.text()?.trim()
            def organization = pom.organization.name.text()?.trim()

            def knownSpdxLicenses = licenses.collect { license ->
                mapPomLicenseToSpdx(license.name as String, license.url as String)
            }.findAll { it }.unique()

            def rawLicenseSummary = licenses.collect { license ->
                [license.name, license.url].findAll { it }.join(' - ')
            }.findAll { it }.join('; ')

            // The runtime file: an AAR or a JAR; a module that is only metadata,
            // such as one Gradle redirects to a platform module, names its .module
            // or .pom.
            def fileStem = "${moduleId.module}-${moduleId.version}"
            def artifacts = verifiedArtifacts[coordinates] ?: []
            def artifact = ['aar', 'jar', 'module', 'pom'].findResult { extension ->
                artifacts.find { it.name == "${fileStem}.${extension}".toString() }
            }
            if (artifact == null || !(artifact.sha256 ==~ /[0-9a-f]{64}/)) {
                throw new GradleException("gradle/verification-metadata.xml has no SHA-256 for ${coordinates}; regenerate it (scripts/android/update_dependency_verification.sh).")
            }
            def repositoryUrl = mavenRepositoryUrlFor(moduleId.group)
            def repositoryQualifier = URLEncoder.encode(repositoryUrl - 'https://', 'UTF-8')

            addSpdxPackage([
                SPDXID          : mavenRef(moduleId),
                name            : "${moduleId.group}:${moduleId.module}".toString(),
                downloadLocation: "${repositoryUrl}/${moduleId.group.replace('.', '/')}/${moduleId.module}/${moduleId.version}/${artifact.name}".toString(),
                licenseDeclared : knownSpdxLicenses.size() == 1 ? knownSpdxLicenses[0] : 'NOASSERTION',
                versionInfo     : moduleId.version.toString(),
                supplier        : organization ? "Organization: ${organization}".toString() : 'NOASSERTION',
                homepage        : pomUrl ?: null,
                summary         : "Android runtime dependency ${coordinates}.".toString(),
                licenseComments : rawLicenseSummary ?: 'License metadata was not available in the resolved POM.',
                sourceInfo      : 'Collected from the resolved runtime classpath, each dependency POM, and the dependency verification metadata.',
                checksums       : [[algorithm: 'SHA256', checksumValue: artifact.sha256]],
                externalRefs    : [[
                    referenceCategory: 'PACKAGE-MANAGER',
                    referenceType    : 'purl',
                    referenceLocator : "pkg:maven/${moduleId.group}/${moduleId.module}@${moduleId.version}?repository_url=${repositoryQualifier}".toString()
                ]]
            ])
        }

        // The resolved graph: the app depends on its direct modules, and each
        // module on its own.
        def edges = new TreeSet<String>()
        resolution.allComponents.each { component ->
            def from = component.id instanceof ModuleComponentIdentifier ? mavenRef(component.id as ModuleComponentIdentifier) : appRef
            component.dependencies.findAll { it instanceof ResolvedDependencyResult }.each { dependency ->
                def selected = (dependency as ResolvedDependencyResult).selected.id
                if (selected instanceof ModuleComponentIdentifier) {
                    edges << "${from} ${mavenRef(selected as ModuleComponentIdentifier)}".toString()
                }
            }
        }
        edges.each { edge ->
            def (from, to) = edge.split(' ')
            relate(from, 'DEPENDS_ON', to)
        }
    }
    [packages: packages, relationships: relationships]
}

// The SPDX creation time is the source commit's, not the clock's, so two
// builds of one commit package the same bytes; SOURCE_DATE_EPOCH, the
// reproducible-builds convention, overrides it.
def spdxCreatedEpochSeconds = (System.getenv('SOURCE_DATE_EPOCH')
    ?: readGitOutput(['show', '-s', '--format=%ct', androidSourceCommit])
    ?: '0').toLong()

tasks.register('generateThirdPartySpdx') {
    inputs.file(repoNoticeInventoryFile)
    repoNoticeInventory.components.each { component ->
        inputs.file(resolveRepoNoticeSourceFile(component as Map))
    }
    inputs.property('androidSourceRepositoryUrl', androidSourceRepositoryUrl ?: '')
    inputs.property('androidSourceCommit', androidSourceCommit ?: '')
    inputs.property('upstreamSourceRepositoryUrl', upstreamSourceRepositoryUrl ?: '')
    inputs.property('upstreamSourceCommit', upstreamSourceCommit ?: '')
    inputs.property('xlsxioSourceRepositoryUrl', xlsxioSourceRepositoryUrl ?: '')
    inputs.property('xlsxioSourceCommit', xlsxioSourceCommit ?: '')

    def spdxAssetsDir = file(generatedComplianceAssetsDir)
    def spdxOutputFile = new File(spdxAssetsDir, 'THIRD-PARTY.spdx.json')
    outputs.file(spdxOutputFile)

    inputs.property('spdxInventory', spdxRuntimeInventory)
    inputs.property('spdxCreatedEpochSeconds', spdxCreatedEpochSeconds)

    def documentSourceCommit = androidSourceCommit
    def documentInventory = spdxRuntimeInventory
    def documentCreated = new Date(spdxCreatedEpochSeconds * 1000L).format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))

    doLast {
        spdxAssetsDir.mkdirs()
        def inventory = documentInventory.get()

        def spdxDocument = [
            spdxVersion      : 'SPDX-2.3',
            dataLicense      : 'CC0-1.0',
            SPDXID           : 'SPDXRef-DOCUMENT',
            name             : 'R47 Android third-party inventory',
            documentNamespace: "https://r47.invalid/spdx/android/${documentSourceCommit ?: 'unknown'}".toString(),
            creationInfo     : [
                created : documentCreated,
                creators: ['Tool: Gradle generateThirdPartySpdx task']
            ],
            packages         : inventory.packages,
            relationships    : inventory.relationships
        ]

        spdxOutputFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(spdxDocument)) + '\n'
    }
}

tasks.register('generateSourceManifest') {
    inputs.property('androidSourceRepositoryUrl', androidSourceRepositoryUrl ?: '')
    inputs.property('androidSourceCommit', androidSourceCommit ?: '')
    inputs.property('upstreamSourceRepositoryUrl', upstreamSourceRepositoryUrl ?: '')
    inputs.property('upstreamSourceCommit', upstreamSourceCommit ?: '')
    inputs.property('xlsxioSourceRepositoryUrl', xlsxioSourceRepositoryUrl ?: '')
    inputs.property('xlsxioSourceCommit', xlsxioSourceCommit ?: '')
    outputs.file("${generatedComplianceAssetsDir}/SOURCE")

    def generatedAssetsDir = file(generatedComplianceAssetsDir)
    doLast {
        generatedAssetsDir.mkdirs()
        def sourceLines = []

        if (upstreamSourceRepositoryUrl && upstreamSourceCommit) {
            sourceLines << "upstream_url=${upstreamSourceRepositoryUrl}"
            sourceLines << "upstream_commit=${upstreamSourceCommit}"
        }

        sourceLines << "android_source_repository_url=${androidSourceRepositoryUrl}"
        sourceLines << "android_source_commit=${androidSourceCommit}"
        sourceLines << "xlsxio_url=${xlsxioSourceRepositoryUrl}"
        sourceLines << "xlsxio_commit=${xlsxioSourceCommit}"

        new File(generatedAssetsDir, 'SOURCE').text = sourceLines.join('\n') + '\n'
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyGplLicense')
    dependsOn tasks.named('generateRuntimeFontAssets')
    dependsOn tasks.named('generateRepoNoticeAssets')
    dependsOn tasks.named('generateThirdPartySpdx')
    dependsOn tasks.named('generateXlsxioLicense')
    dependsOn tasks.named('generateSourceManifest')
}

// detekt runs its default rule set over the Kotlin sources, with type resolution
// in :app:detektMain and :app:detektTest. Each variant's baseline,
// detekt-baseline-<variant>.xml beside this file, holds the findings the code
// carried when that task was adopted; any new finding fails it.
// scripts/android/run_detekt.sh also fails when a baseline entry no longer
// matches a finding, so fixing one forces its removal and a baseline only
// shrinks. The plain detekt task skips every rule that needs types, so it runs
// the two typed tasks instead of itself.
detekt {
    buildUponDefaultConfig = true
    baseline = file('detekt-baseline.xml')
}
tasks.named('detekt') {
    enabled = false
    dependsOn 'detektMain', 'detektTest'
}
// Its untyped file would be the fallback baseline of any variant without one.
tasks.named('detektBaseline') {
    enabled = false
}
