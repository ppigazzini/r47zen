// The JDK the Gradle Java toolchain resolves: javac and the JVM unit tests run
// on it, and the Kotlin compile reads its JDK home. It does not choose the JDK
// that runs Gradle, AGP, and the Kotlin compiler: JAVA_HOME does, or java on PATH
// when it is unset, and CI makes the two equal through the setup-java steps.
// Declaring a toolchain rather than
// inheriting whatever JDK launched Gradle keeps a maintainer host and the CI
// runners on the same javac and the same test JVM; without it the build silently
// follows JAVA_HOME. R47_DEFAULT_ANDROID_BUILD_JDK_VERSION is the single source
// the setup-java steps read as well, and
// scripts/android/run_build_jdk_pin_coherence_contract.sh fails if the two
// drift. A host without that JDK fails with "Cannot find a Java installation on
// your machine" instead of compiling against an unpinned one.
def buildJdkVersion = readDefaultInteger('R47_DEFAULT_ANDROID_BUILD_JDK_VERSION')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(buildJdkVersion)
    }
}

android {
    namespace = defaultApplicationId
    compileSdk = project.findProperty('r47.compileSdk')?.toInteger() ?: readDefaultInteger('R47_DEFAULT_ANDROID_COMPILE_SDK')
    compileSdkMinor = project.findProperty('r47.compileSdkMinor')?.toInteger() ?: readDefaultInteger('R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR')
    def coreVersion = (project.findProperty('r47.coreVersion') ?: "unknown").toString()
    // The dev token becomes a SemVer pre-release, <version>-<token>, and a field
    // of the r47zen_<version>_... file name, so it keeps to [0-9A-Za-z.-].
    def normalizedCoreVersion = coreVersion.replaceAll(/[^0-9A-Za-z.-]/, "-")
    def normalizedReleaseChannelBuildToken = releaseChannelBuildToken?.replaceAll(/[^0-9A-Za-z.-]/, "-")
    // The upstream core's own version (VERSION1 in src/c47/defines.h), read by
    // scripts/android/read_upstream_version.sh; empty or malformed shows the
    // commit alone.
    def upstreamVersion = (project.findProperty('r47.upstreamVersion') ?: '').toString()
    if (!(upstreamVersion ==~ /[0-9A-Za-z.-]{1,40}/)) {
        upstreamVersion = ''
    }
    def coreLabel = upstreamVersion ? "C47 ${upstreamVersion}, ${coreVersion.take(8)}" : coreVersion
    def releaseVersionCode = Integer.parseInt((project.findProperty('r47.versionCode') ?: readDefaultValue('R47_DEFAULT_ANDROID_VERSION_CODE')).toString())
    def releaseVersionName = (project.findProperty('r47.versionName') ?: readDefaultValue('R47_DEFAULT_ANDROID_VERSION_NAME')).toString()
    def isDevReleaseChannel = releaseChannel == 'dev'
    def effectiveDevReleaseToken = normalizedReleaseChannelBuildToken ?: normalizedCoreVersion
    def effectiveAboutVersionName = isDevReleaseChannel ? "${releaseVersionName}-${effectiveDevReleaseToken}" : releaseVersionName

    signingConfigs {
        if (isPrereleaseSigningConfigured) {
            prerelease {
                storeFile = rootProject.file(prereleaseStoreFilePath)
                storePassword = prereleaseStorePassword
                keyAlias = prereleaseKeyAlias
                keyPassword = prereleaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
        if (isReleaseSigningConfigured) {
            release {
                storeFile = rootProject.file(releaseStoreFilePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    defaultConfig {
        applicationId = defaultApplicationId
        minSdk = project.findProperty('r47.minSdk')?.toInteger() ?: readDefaultInteger('R47_DEFAULT_ANDROID_MIN_SDK')
        targetSdk = project.findProperty('r47.targetSdk')?.toInteger() ?: readDefaultInteger('R47_DEFAULT_ANDROID_TARGET_SDK')
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        versionCode = releaseVersionCode
        versionName = releaseVersionName
        resValue "string", "about_version_summary", "R47 Zen ${effectiveAboutVersionName} (Core: ${coreLabel})"
        resValue "string", "android_source_repository_url", androidSourceRepositoryUrl

        // Use property override if provided, otherwise default to a verified version
        // To use system default, user can pass -Pr47.ndkVersion=
        ndkVersion = project.findProperty('r47.ndkVersion') ?: readDefaultValue('R47_DEFAULT_ANDROID_NDK_VERSION')

        externalNativeBuild {
            cmake {
                arguments(*externalNativeBuildArguments)
            }
        }
        ndk {
            abiFilters(*configuredAbiFilters)
        }
    }

    buildTypes {
        debug {
            debuggable = true
            jniDebuggable = true
            // Keep the debug snapshot lane separate from a future store release.
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-snapshot.${normalizedCoreVersion}"
        }
        release {
            minifyEnabled = releaseMinifyEnabled
            shrinkResources = releaseShrinkResourcesEnabled
            if (isDevReleaseChannel) {
                applicationIdSuffix = ".dev"
                versionNameSuffix = "-${effectiveDevReleaseToken}"
                if (isPrereleaseSigningConfigured) {
                    signingConfig = signingConfigs.prerelease
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = releaseNativeDebugSymbolLevel
            }
            if (!isDevReleaseChannel && isReleaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }

    testBuildType = configuredTestBuildType

    buildFeatures {
        resValues = true
        viewBinding = true
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = project.findProperty('r47.cmakeVersion') ?: readDefaultValue('R47_DEFAULT_ANDROID_CMAKE_VERSION')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(readDefaultValue('R47_DEFAULT_ANDROID_JAVA_VERSION'))
        targetCompatibility JavaVersion.toVersion(readDefaultValue('R47_DEFAULT_ANDROID_JAVA_VERSION'))
    }

    sourceSets {
        main {
            assets.srcDir generatedComplianceAssetsDir
            assets.srcDir generatedRuntimeAssetsDir
        }
        test {
            resources.srcDir "${repositoryRootDir}/scripts/r47_contracts/data"
        }
        debug {
            kotlin.srcDir 'src/instrumentationHost/java'
            manifest.srcFile 'src/instrumentationHost/AndroidManifest.xml'
        }
        if (includeInstrumentationHost) {
            release {
                kotlin.srcDir 'src/instrumentationHost/java'
                manifest.srcFile 'src/instrumentationHost/AndroidManifest.xml'
            }
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true

        // Robolectric pulls in conscrypt, which calls System.load() from the
        // unnamed module. From JDK 24 that is a restricted method: the JVM
        // prints a "Restricted methods will be blocked in a future release"
        // warning on every unit-test run, and a later JDK turns it into an
        // error. Granting native access to the classpath silences the warning
        // now and keeps the lane working when the block lands. The flag does
        // not exist before JDK 24, so it is gated on the pinned build JDK
        // rather than passed unconditionally.
        //
        // Robolectric runs each test at the targetSdk in the merged manifest.
        // From API 36 its sandbox setup writes a FileDescriptor's raw int
        // through jdk.internal.access.SharedSecrets, which java.base does not
        // export; without the export every Robolectric test fails before it
        // starts with "Failed to interact with raw FileDescriptor internals".
        unitTests.all { test ->
            if (buildJdkVersion >= 24) {
                test.jvmArgs '--enable-native-access=ALL-UNNAMED'
            }
            test.jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }

    lint {
        checkDependencies = true
        // Gate new lint findings: warnings fail the build. No baseline -- the
        // grandfathered backlog (a stale core-ktx dependency pin) is cleared, so
        // lint must stay clean rather than grandfather findings.
        warningsAsErrors = true
    }

    packaging {
        jniLibs {
            // Uncompressed, extract-on-install disabled. Declared explicitly so an
            // AGP default change cannot silently alter the native packaging contract.
            useLegacyPackaging = false
        }
    }

}

