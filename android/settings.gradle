import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
	repositories {
		// Google's namespaces come from Google's repository alone. A plain content filter
		// is not exclusive: a group Google misses still falls through to the next
		// repository, where a same-coordinate artifact would be taken.
		exclusiveContent {
			forRepository { google() }
			filter {
				includeGroupAndSubgroups("androidx")
				includeGroupAndSubgroups("com.android")
				includeGroupAndSubgroups("com.google.android")
				includeGroupAndSubgroups("com.google.testing.platform")
			}
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// The groups, with their subgroups, that only Google's repository serves. The app's
// SPDX inventory reads this list through gradle.ext to name the repository each
// runtime module came from, and the packaging evidence reads it from this file.
// pluginManagement runs before the rest of this script and cannot see it, so it
// repeats the list; test_spdx_inventory_contract.py holds the two equal.
def r47GoogleMavenGroups = ['androidx', 'com.android', 'com.google.android', 'com.google.testing.platform']
gradle.ext.r47GoogleMavenGroups = r47GoogleMavenGroups

dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		// Google's namespaces come from Google's repository alone. A plain content filter
		// is not exclusive: a group Google misses still falls through to the next
		// repository, where a same-coordinate artifact would be taken.
		exclusiveContent {
			forRepository { google() }
			filter {
				r47GoogleMavenGroups.each { group -> includeGroupAndSubgroups(group) }
			}
		}
		mavenCentral()
	}
}

rootProject.name = "R47"
include ':app'
