repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      # Keep the vendored FSF mini-gmp fallback byte-exact. Its GNU sources use
      # form-feed page breaks, which these two hooks read as trailing whitespace
      # and strip. The file is never staged in normal work, so the damage only
      # shows up under `pre-commit run --all-files` - silently rewriting a
      # third-party source we are supposed to carry unmodified.
      - id: end-of-file-fixer
        exclude: ^android/compat/mini-gmp-fallback/
      - id: trailing-whitespace
        exclude: ^android/compat/mini-gmp-fallback/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # `ruff-check` is the current hook id; the bare `ruff` id still resolves
      # but is a legacy alias upstream and reports itself as one.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # Lint only repo-owned shell scripts; the vendored android/gradlew wrapper
        # is Gradle-generated and not maintained here.
        files: ^scripts/.*\.sh$
        args: [--severity=warning]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        # Format repo-owned shell scripts: 4-space indent, indented case bodies.
        files: ^scripts/.*\.sh$
        args: [-w, -i, '4', -ci]
  # The two workflow linters Shell Lint runs, at the versions it pins
  # (run_action_pin_consistency_contract.sh holds them equal). actionlint
  # builds with Go, which pre-commit installs on first use. It runs without
  # its shellcheck pass here: Shell Lint runs that one through a pinned
  # shellcheck at --severity=warning, and a hook cannot set SHELLCHECK_OPTS,
  # so a local shellcheck would report style findings CI does not.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --no-online-audits, --min-severity=medium]
  - repo: local
    hooks:
      - id: upstream-source-no-pin
        # Fail if the Git-tracked upstream.source regains an upstream_commit pin.
        # The project tracks the latest upstream HEAD; a roadblock pin belongs in
        # the Git-ignored upstream.lock, never in upstream.source.
        name: upstream.source pins no commit
        entry: scripts/upstream-sync/upstream.sh verify-source-policy
        language: script
        files: ^upstream\.source$
        pass_filenames: false
      - id: docs-lint
        # Docs rot gate; the script's banner lists its checks. It discovers its
        # own file set through `git ls-files`, so it lints every tracked doc,
        # not only the staged ones; it needs no toolchain and runs in seconds.
        name: docs rot gate
        entry: scripts/docs/run_docs_lint.sh
        language: script
        # Every commit, not only one that stages a .md: the gate also fails a
        # doc that names a path the commit renames or deletes, and pre-commit
        # hands a hook no deleted file to match on.
        always_run: true
        pass_filenames: false
      - id: workflow-contracts
        # The host CI contracts (signing isolation, release provenance, pinned
        # toolchains, test integrity) read workflows, scripts, Android build
        # inputs, and the tool pins in this file, pyproject.toml, and uv.lock.
        # They need no SDK and run in seconds, so a broken contract fails here
        # before CI. android-ci runs the same group inside ci-required.
        name: host CI contracts
        entry: scripts/android/run_workflow_contracts.sh
        language: script
        files: ^(\.github/|scripts/|android/|\.pre-commit-config\.yaml$|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
      - id: restore-boundary
        # Every tracked root entry, file or directory, must be in upstream.sh's
        # restore set, or the next sync replaces it with upstream's copy. The
        # check reads the index, so it sees what this commit adds, at any depth;
        # it takes milliseconds, so it runs on every commit.
        name: upstream sync restore boundary
        entry: scripts/upstream-sync/upstream.sh verify-restore-boundary
        language: script
        always_run: true
        pass_filenames: false
      - id: commit-message
        # The commit rules in android/docs/dev/10-writing.md that a script can
        # check. Opt-in: this file sets no default_install_hook_types, so a
        # plain `pre-commit install` leaves it off, and it runs only after
        # `pre-commit install --hook-type commit-msg`.
        name: commit message rules
        entry: scripts/docs/check_commit_message.sh
        language: script
        stages: [commit-msg]
