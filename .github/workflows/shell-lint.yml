name: Shell Lint

on:
  workflow_dispatch:
  push:
    branches:
      - github_ci
      - main
  pull_request:

permissions:
  contents: read

# One ShellCheck for both jobs: the scripts lint and the inline run: blocks
# actionlint shells out to must not disagree about what a warning is.
env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Lint and format-check repo-owned shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHFMT_VERSION: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        shell: bash
        # The pinned release, not the runner image's copy: an image update would
        # otherwise change the lint with no commit here. Every download here
        # passes --retry: GitHub's release host answers a 504 now and then, and
        # curl retries only a timeout or a 408, 429, 500, 502, 503, or 504,
        # never a 404.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --status
          tar -xJf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" ./shellcheck
          ./shellcheck --version

      - name: Install shfmt
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" \
            --output /usr/local/bin/shfmt
          echo "${SHFMT_SHA256}  /usr/local/bin/shfmt" | sha256sum --check --status
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: Lint repo-owned shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_scripts < <(find scripts -name '*.sh' | LC_ALL=C sort)
          printf 'Linting %d repo-owned shell scripts at --severity=warning\n' "${#shell_scripts[@]}"
          ./shellcheck --severity=warning "${shell_scripts[@]}"

      - name: Format-check repo-owned shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_scripts < <(find scripts -name '*.sh' | LC_ALL=C sort)
          printf 'Format-checking %d repo-owned shell scripts with shfmt -i 4 -ci\n' "${#shell_scripts[@]}"
          shfmt -i 4 -ci -d "${shell_scripts[@]}"

  workflow-lint:
    name: Lint GitHub Actions workflows with actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --status
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Install shellcheck
        shell: bash
        # Pin the shellcheck actionlint shells out to, so the inline-run-block
        # lint is deterministic and does not drift with the runner image's
        # preinstalled version.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --status
          tar -xJf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" ./shellcheck
          ./shellcheck --version

      - name: Lint workflows with actionlint
        shell: bash
        # actionlint validates workflow syntax, expressions, glob patterns, and
        # the matrix and needs graphs -- the workflow bugs that YAML alone hides.
        # It also shellchecks each inline run: block through the pinned shellcheck
        # above, at --severity=warning to match the dedicated scripts/*.sh job, so
        # real bugs in inline bash fail here while pure-style SC2129 noise does
        # not. The dedicated shellcheck job still owns scripts/*.sh.
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          ./actionlint -color -shellcheck=./shellcheck

      # The same uv android-ci pins; run_action_pin_consistency_contract.sh
      # holds both to the uv-pre-commit rev.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          checksum: 'f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645'

      - name: Run zizmor
        shell: bash
        # Offline audits at medium+ severity; the three reviewed github-env writes
        # in the composite actions carry inline zizmor:ignore rationale. Online
        # audits (known-vulnerable-action lookups) are a follow-up.
        run: |
          set -euo pipefail
          uvx zizmor@1.31.1 --no-online-audits --min-severity=medium \
            .github/workflows .github/actions .github/dependabot.yml
