name: Android Release

run-name: Android Release ${{ inputs.confirm_version }} (${{ inputs.confirm_version_code }}) -> ${{ inputs.play_track }}

on:
  workflow_dispatch:
    inputs:
      confirm_version_code:
        description: Play version code to release; must equal R47_DEFAULT_ANDROID_VERSION_CODE in android/r47-defaults.properties
        required: true
        type: string
      confirm_version:
        description: Version to release; must equal R47_DEFAULT_ANDROID_VERSION_NAME in android/r47-defaults.properties
        required: true
        type: string
      play_track:
        description: Google Play track that receives the signed AAB after the GitHub release (none publishes on GitHub only)
        required: false
        default: none
        type: choice
        options:
          - none
          - internal
          - alpha
          - production
      play_release_notes:
        description: Play release notes in en-US, at most 500 characters (blank = the version and the calculator core)
        required: false
        default: ''
        type: string
      upstream_commit:
        description: Optional full 40-character upstream commit SHA to pin for a roadblock re-release (blank = latest HEAD)
        required: false
        type: string
      allow_overwrite:
        description: Allow re-publishing over an existing release tag (default false; only for a deliberate re-cut of the previous release, with play_track none)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-inputs:
    name: Resolve release version inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_code: ${{ steps.resolve.outputs.version_code }}
      version_name: ${{ steps.resolve.outputs.version_name }}
      release_mode: ${{ steps.resolve.outputs.release_mode }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_title: ${{ steps.resolve.outputs.release_title }}
      previous_release_tag: ${{ steps.resolve.outputs.previous_release_tag }}
      previous_signing_cert_sha256: ${{ steps.resolve.outputs.previous_signing_cert_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version check diffs this commit against the previous
          # release's, so it needs the history.
          fetch-depth: 0

      - name: Resolve release version inputs
        id: resolve
        shell: bash
        env:
          R47_CONFIRM_VERSION_CODE_INPUT: ${{ inputs.confirm_version_code }}
          R47_CONFIRM_VERSION_INPUT: ${{ inputs.confirm_version }}
          R47_ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
          R47_PLAY_TRACK: ${{ inputs.play_track }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_mode="manual"
          defaults_file="android/r47-defaults.properties"

          # The next release's two numbers live in the tracked defaults file
          # and the form confirms both, so a typo stops here instead of
          # becoming a tag or a Play upload.
          version_code="$(sed -n 's/^R47_DEFAULT_ANDROID_VERSION_CODE=//p' "$defaults_file")"
          version_name="$(sed -n 's/^R47_DEFAULT_ANDROID_VERSION_NAME=//p' "$defaults_file")"
          if [[ "$R47_CONFIRM_VERSION_CODE_INPUT" != "$version_code" ]]; then
            echo "${defaults_file} says R47_DEFAULT_ANDROID_VERSION_CODE=${version_code}, confirm_version_code says ${R47_CONFIRM_VERSION_CODE_INPUT}." >&2
            exit 1
          fi
          if [[ "$R47_CONFIRM_VERSION_INPUT" != "$version_name" ]]; then
            echo "${defaults_file} says R47_DEFAULT_ANDROID_VERSION_NAME=${version_name}, confirm_version says ${R47_CONFIRM_VERSION_INPUT}." >&2
            exit 1
          fi

          case "$version_code" in
            ''|*[!0-9]*)
              echo "R47_DEFAULT_ANDROID_VERSION_CODE must be a positive integer, got '${version_code}'." >&2
              exit 1
              ;;
          esac

          if [[ "$version_code" -lt 1 ]]; then
            echo "R47_DEFAULT_ANDROID_VERSION_CODE must be greater than zero." >&2
            exit 1
          fi
          if [[ ! "$version_name" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "R47_DEFAULT_ANDROID_VERSION_NAME '${version_name}' is not major.minor.patch." >&2
            exit 1
          fi

          # The versionCode is a counter, not a date. Play's ceiling is
          # 2100000000 and a code can never be lowered or reused, so a
          # date-shaped value (2026100903 was uploaded once, and that app
          # entry had to be deleted) burns the range in one dispatch. Cap
          # the value far below the ceiling and require exactly the previous
          # production release's code plus one;
          # scripts/android/resolve_previous_release.sh reads it from the
          # release body line this workflow writes and skips codes above the
          # cap, which belong to the retired date scheme. The first counter
          # release is 1.
          version_code_cap=100000
          if [[ "$version_code" -gt "$version_code_cap" ]]; then
            echo "R47_DEFAULT_ANDROID_VERSION_CODE $version_code is above $version_code_cap; it must be a small counter (previous production release plus one), not a date." >&2
            exit 1
          fi
          releases_json="${RUNNER_TEMP}/releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" >"$releases_json"
          previous="$(bash ./scripts/android/resolve_previous_release.sh \
            --releases-json "$releases_json" --cap "$version_code_cap")"
          previous_code="$(sed -n 's/^previous_code=//p' <<<"$previous")"
          previous_tag="$(sed -n 's/^previous_tag=//p' <<<"$previous")"
          previous_name="$(sed -n 's/^previous_name=//p' <<<"$previous")"
          expected_code=$((previous_code + 1))
          recut=false
          if [[ "$R47_ALLOW_OVERWRITE" == "true" && "$version_code" -eq "$previous_code" ]]; then
            # Play takes a version code once, across every track, so a re-cut
            # that keeps the code cannot reach Play; when the first cut never
            # went there either, the GitHub release would still change bytes
            # under a code Play may later receive for different ones.
            if [[ "$R47_PLAY_TRACK" != "none" ]]; then
              echo "allow_overwrite=true re-cuts version code $version_code, which Play refuses to take twice; re-run with play_track=none, or release version code $expected_code." >&2
              exit 1
            fi
            echo "allow_overwrite=true: re-cutting version code $version_code for GitHub only." >&2
            recut=true
          elif [[ "$version_code" -ne "$expected_code" ]]; then
            echo "R47_DEFAULT_ANDROID_VERSION_CODE must be $expected_code (previous production release used $previous_code), got $version_code." >&2
            exit 1
          fi
          echo "version code $version_code follows previous production release $previous_code." >&2

          # The certificate the previous production release was signed with,
          # from its APK evidence, so the release notes can tell its installs
          # when this release cannot update them, and the r47zen commit it was
          # built from, for the version check. Fail closed: a release that
          # cannot answer these would publish without the notice it may need
          # or with an unchecked version. The pattern matches the evidence of
          # both name forms, r47zen-<u8>-<s8>-release-apk-packaging-evidence.zip
          # and r47zen_<version>_<u8>_<s8>_apk-packaging-evidence.zip.
          previous_cert=""
          previous_android_commit=""
          if [[ -n "$previous_tag" ]]; then
            previous_evidence_dir="${RUNNER_TEMP}/previous-release-evidence"
            mkdir -p "$previous_evidence_dir"
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*apk-packaging-evidence.zip' --dir "$previous_evidence_dir"
            shopt -s nullglob
            previous_zips=("$previous_evidence_dir"/*.zip)
            shopt -u nullglob
            if [[ "${#previous_zips[@]}" -ne 1 ]]; then
              echo "Expected one APK evidence archive on ${previous_tag}, found ${#previous_zips[@]}." >&2
              exit 1
            fi
            previous_metadata="$(unzip -p "${previous_zips[0]}" BUILD-METADATA.txt)"
            previous_cert="$(sed -n 's/^artifact_signing_cert_sha256=//p' <<<"$previous_metadata")"
            if [[ ! "$previous_cert" =~ ^[0-9a-f]{64}$ ]]; then
              echo "The APK evidence of ${previous_tag} records no signing certificate ('${previous_cert}')." >&2
              exit 1
            fi
            echo "previous production release ${previous_tag} was signed by ${previous_cert}." >&2
            previous_android_commit="$(sed -n 's/^android_source_commit=//p' <<<"$previous_metadata")"
            if [[ ! "$previous_android_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The APK evidence of ${previous_tag} records no android_source_commit ('${previous_android_commit}')." >&2
              exit 1
            fi
          fi

          if [[ "$recut" == "true" ]]; then
            # A re-cut republishes the previous release under its own tag.
            if [[ "$version_name" != "$previous_name" ]]; then
              echo "allow_overwrite=true re-cuts ${previous_tag}, so the version must stay ${previous_name}, not ${version_name}." >&2
              exit 1
            fi
          else
            # Every release gets a new major.minor.patch: MINOR with PATCH 0
            # when app code changed since the previous release, PATCH
            # otherwise (android/docs/dev/10-writing.md#version-numbers).
            bash ./scripts/android/check_release_version.sh \
              --version "$version_name" \
              --previous-version "$previous_name" \
              --previous-commit "$previous_android_commit" \
              --head HEAD
          fi

          # Refuse to re-publish over an existing release tag. The publish step
          # builds the LATEST upstream HEAD and uses overwrite_files, so re-running
          # the dispatch with the same version on a later day would replace
          # the already-published signed bytes under the same tag with a different
          # core, silently invalidating every recorded SHA256. Fail unless
          # allow_overwrite is set for a deliberate re-cut. The version is
          # major.minor.patch, checked above, so it is the tag as it stands.
          release_tag="r47zen-v${version_name}"
          if [[ "$R47_ALLOW_OVERWRITE" != "true" ]]; then
            # ls-remote returns 0 when the tag exists and 2 when it does not;
            # any other code is a network/auth error. Fail closed on both "exists"
            # and "error" so a transient failure never opens the overwrite gate.
            # (`set -e` does not fire inside a condition, so branch on the code.)
            ls_remote_status=0
            git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1 || ls_remote_status=$?
            if [[ "$ls_remote_status" -eq 0 ]]; then
              echo "Release tag ${release_tag} already exists; refusing to overwrite a published release. Re-run with allow_overwrite=true only for a deliberate re-cut." >&2
              exit 1
            elif [[ "$ls_remote_status" -ne 2 ]]; then
              echo "Could not determine whether ${release_tag} exists (git ls-remote exit ${ls_remote_status}); refusing to proceed rather than risk overwriting a published release." >&2
              exit 1
            fi
          else
            echo "allow_overwrite=true: proceeding even if ${release_tag} already exists." >&2
          fi

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_mode=$release_mode" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_title=R47 Zen $version_name" >> "$GITHUB_OUTPUT"
          echo "previous_release_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "previous_signing_cert_sha256=$previous_cert" >> "$GITHUB_OUTPUT"

  resolve-upstream-core:
    name: Resolve authoritative upstream core revision
    uses: ./.github/workflows/resolve-upstream-core.yml
    with:
      # Release the latest upstream HEAD, same as CI. The resolved commit is
      # recorded in the release tag and BUILD-METADATA for traceability. To hold
      # or reproduce an older revision (a roadblock re-release), supply the
      # upstream_commit dispatch input; resolution then locks to that commit.
      mode: latest
      upstream_commit: ${{ inputs.upstream_commit }}

  build-production-release-bundle:
    name: Build unsigned production release assets
    if: github.ref == 'refs/heads/main'
    # This job syncs, compiles, and runs the unpinned upstream core, so it holds
    # no signing input: no environment, no secret, no keystore. A compile step
    # can embed any readable file into the shipped library, and upstream test
    # code runs with this job's environment. sign-production-release signs the
    # bytes this job uploads on a fresh runner that executes none of it.
    needs:
      - resolve-release-inputs
      - resolve-upstream-core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      unsigned_artifact_name: ${{ steps.meta.outputs.unsigned_artifact_name }}
      apk_artifact_name: ${{ steps.meta.outputs.apk_artifact_name }}
      release_bundle_name: ${{ steps.meta.outputs.release_bundle_name }}
      release_apk_name: ${{ steps.meta.outputs.release_apk_name }}
      upstream_version: ${{ steps.upstream.outputs.upstream_version }}
    steps:
      - name: Configure Git init defaults
        shell: bash
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared Android defaults
        id: defaults
        shell: bash
        run: |
          set -euo pipefail

          . ./android/r47-defaults.properties

          echo "build_jdk_version=$R47_DEFAULT_ANDROID_BUILD_JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "application_id=$R47_DEFAULT_ANDROID_APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "android_test_abi_filters=$R47_DEFAULT_ANDROID_TEST_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$R47_DEFAULT_ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$R47_DEFAULT_ANDROID_CMAKE_VERSION" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$R47_DEFAULT_ANDROID_COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "compile_sdk_minor=$R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR" >> "$GITHUB_OUTPUT"
          echo "android_test_api_level=$R47_DEFAULT_ANDROID_TEST_API_LEVEL" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          echo "abi_filters=$R47_DEFAULT_ANDROID_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "xlsxio_url=$R47_DEFAULT_XLSXIO_URL" >> "$GITHUB_OUTPUT"
          echo "xlsxio_commit=$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"
          echo "xlsxio_prefix=$HOME/.cache/r47/xlsxio/$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Detect runner build concurrency
        id: jobs
        shell: bash
        run: |
          set -euo pipefail

          jobs=$(nproc)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        shell: bash
        run: bash ./scripts/android/install_linux_build_deps.sh

      - name: Set up the pinned build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.defaults.outputs.build_jdk_version }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up Android SDK
        id: android-sdk
        uses: ./.github/actions/setup-android-sdk
        with:
          compile-sdk: ${{ steps.defaults.outputs.compile_sdk }}
          compile-sdk-minor: ${{ steps.defaults.outputs.compile_sdk_minor }}
          build-tools-version: ${{ steps.defaults.outputs.build_tools_version }}
          cmake-version: ${{ steps.defaults.outputs.cmake_version }}
          ndk-version: ${{ steps.defaults.outputs.ndk_version }}
          include-emulator: 'true'
          android-test-api-level: ${{ steps.defaults.outputs.android_test_api_level }}

      - name: Install matching host LLVM profiling runtime
        shell: bash
        run: |
          set -euo pipefail

          ndk_root="${{ steps.android-sdk.outputs.sdk_root }}/ndk/${{ steps.defaults.outputs.ndk_version }}"
          clang_bin="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          llvm_major="$($clang_bin --version | sed -nE '1s/.*clang version ([0-9]+).*/\1/p')"

          if [[ -z "$llvm_major" ]]; then
            echo "Failed to determine LLVM major version from $clang_bin" >&2
            exit 1
          fi

          bash ./scripts/android/install_host_llvm_toolchain.sh "$llvm_major"

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/android/build_android.sh

      - name: Set up xlsxio toolchain
        uses: ./.github/actions/setup-xlsxio-toolchain
        with:
          url: ${{ steps.defaults.outputs.xlsxio_url }}
          commit: ${{ steps.defaults.outputs.xlsxio_commit }}
          prefix: ${{ steps.defaults.outputs.xlsxio_prefix }}
          jobs: ${{ steps.jobs.outputs.jobs }}

      - name: Sync authoritative upstream core
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/upstream-sync/upstream.sh sync --auto --write-lock \
            --url "${{ needs.resolve-upstream-core.outputs.upstream_url }}" \
            --commit "${{ needs.resolve-upstream-core.outputs.upstream_commit }}"
          bash ./scripts/upstream-sync/hydrate_submodules.sh \
            "${{ needs.resolve-upstream-core.outputs.upstream_commit }}" \
            "${{ needs.resolve-upstream-core.outputs.upstream_url }}"
          echo "upstream_url=${{ needs.resolve-upstream-core.outputs.upstream_url }}" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=${{ needs.resolve-upstream-core.outputs.upstream_commit }}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$(bash ./scripts/android/read_upstream_version.sh src/c47/defines.h)" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          eval "$(bash ./scripts/android/resolve_android_artifact_metadata.sh \
            --upstream-commit "${{ steps.upstream.outputs.upstream_commit }}" \
            --android-commit "${{ github.sha }}" \
            --version "${{ needs.resolve-release-inputs.outputs.version_name }}")"

          echo "artifact_name=$R47_ANDROID_RELEASE_ARTIFACT_STEM" >> "$GITHUB_OUTPUT"
          echo "apk_artifact_name=${R47_ANDROID_RELEASE_ARTIFACT_STEM}-apk" >> "$GITHUB_OUTPUT"
          echo "unsigned_artifact_name=${R47_ANDROID_RELEASE_ARTIFACT_STEM}-unsigned" >> "$GITHUB_OUTPUT"
          echo "release_bundle_name=$R47_ANDROID_RELEASE_AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "release_apk_name=$R47_ANDROID_RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare staged native inputs and simulator parity
        shell: bash
        env:
          R47_NDK_VERSION: ${{ steps.defaults.outputs.ndk_version }}
          R47_BUILD_JOBS: ${{ steps.jobs.outputs.jobs }}
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.jobs.outputs.jobs }}
          R47_GRADLE_ARGS: '--daemon --stacktrace --console=plain'
          R47_PGO_OUTPUT_DIR: ${{ github.workspace }}/ci-artifacts/pgo
          R47_SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          R47_SOURCE_COMMIT: ${{ github.sha }}
          R47_UPSTREAM_SOURCE_REPOSITORY_URL: ${{ steps.upstream.outputs.upstream_url }}
          R47_UPSTREAM_SOURCE_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          R47_XLSXIO_URL: ${{ steps.defaults.outputs.xlsxio_url }}
          R47_XLSXIO_COMMIT: ${{ steps.defaults.outputs.xlsxio_commit }}
          GRADLE_OPTS: -Dorg.gradle.workers.max=${{ steps.jobs.outputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/logs
          ./scripts/android/build_android.sh \
            --run-sim-tests \
            --collect-host-pgo \
            --validate-release-pgo \
            2>&1 | tee ci-artifacts/logs/build-android-release.log

      - name: Build unsigned release APK and bundle
        shell: bash
        env:
          R47_RELEASE_HOST_PGO_PROFILE: ${{ github.workspace }}/ci-artifacts/pgo/r47-host-core.profdata
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
          R47_UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          GRADLE_OPTS: -Dorg.gradle.workers.max=${{ steps.jobs.outputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/logs

          cd android
          ./gradlew --max-workers "${{ steps.jobs.outputs.jobs }}" \
            :app:assembleRelease \
            :app:bundleRelease \
            --daemon --stacktrace --console=plain --warning-mode all \
            -Pr47.ndkVersion=${{ steps.defaults.outputs.ndk_version }} \
            -Pr47.includeProgramLoadTestBridge=false \
            -Pr47.pgoProfilePath="$R47_RELEASE_HOST_PGO_PROFILE" \
            -Pr47.versionCode="$R47_VERSION_CODE_INPUT" \
            -Pr47.versionName="$R47_VERSION_NAME_INPUT" \
            -Pr47.coreVersion=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.upstreamVersion="$R47_UPSTREAM_VERSION" \
            -Pr47.sourceRepositoryUrl=${{ github.server_url }}/${{ github.repository }} \
            -Pr47.sourceCommit=${{ github.sha }} \
            -Pr47.upstreamSourceRepositoryUrl=${{ steps.upstream.outputs.upstream_url }} \
            -Pr47.upstreamSourceCommit=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.xlsxioSourceRepositoryUrl=${{ steps.defaults.outputs.xlsxio_url }} \
            -Pr47.xlsxioSourceCommit=${{ steps.defaults.outputs.xlsxio_commit }} \
            2>&1 | tee ../ci-artifacts/logs/android-release-bundle.log

      - name: Stage unsigned release assets for signing
        shell: bash
        run: |
          set -euo pipefail

          apk_dir='android/app/build/outputs/apk/release'
          bundle_path='android/app/build/outputs/bundle/release/app-release.aab'
          mapping_path='android/app/build/outputs/mapping/release/mapping.txt'
          native_symbols_dir='android/app/build/intermediates/native_debug_metadata/release/extractReleaseNativeDebugMetadata/out'
          staging_dir="$PWD/ci-artifacts/release-unsigned"

          if [[ ! -f "$apk_dir/output-metadata.json" ]]; then
            echo "Missing ${apk_dir}/output-metadata.json." >&2
            exit 1
          fi
          apk_file="$(sed -n 's/.*"outputFile": *"\([^"]*\)".*/\1/p' "$apk_dir/output-metadata.json" | head -n 1)"

          # Fail closed if anything in this job signed: signing material here
          # would share a runner with upstream code.
          if [[ "$apk_file" != *-unsigned.apk ]]; then
            echo "Expected an unsigned release APK, but AGP reports '${apk_file}'." >&2
            exit 1
          fi
          for required in "$apk_dir/$apk_file" "$bundle_path" "$mapping_path"; do
            if [[ ! -f "$required" ]]; then
              echo "Missing release output ${required}." >&2
              exit 1
            fi
          done
          # Capture the listing before matching it: unzip piped into grep -q
          # dies of SIGPIPE once grep stops at an early signature entry, and
          # pipefail then reads the match as a miss.
          bundle_entries="$(unzip -Z1 "$bundle_path")"
          if grep -Eq '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$' <<<"$bundle_entries"; then
            echo "Expected an unsigned release bundle, but ${bundle_path} carries a JAR signature." >&2
            exit 1
          fi
          if [[ ! -d "$native_symbols_dir" ]]; then
            echo "Missing native debug metadata directory at ${native_symbols_dir}." >&2
            exit 1
          fi

          mkdir -p "$staging_dir"
          cp "$apk_dir/$apk_file" "$staging_dir/app-release-unsigned.apk"
          cp "$bundle_path" "$staging_dir/app-release-unsigned.aab"
          cp "$mapping_path" "$staging_dir/mapping.txt"
          (
            cd "$native_symbols_dir"
            zip -qr "$staging_dir/native-debug-symbols.zip" .
          )

      - name: Upload release build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-logs
          path: |
            ci-artifacts/logs/
            android/app/build/reports/tests
            android/app/build/test-results
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload host-core PGO artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-host-core-pgo
          path: |
            ci-artifacts/pgo/
            ci-artifacts/logs/build-android-release.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload unsigned release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.unsigned_artifact_name }}
          path: ci-artifacts/release-unsigned/
          if-no-files-found: error
          retention-days: 7

  sign-production-release:
    name: Sign production release assets
    if: github.ref == 'refs/heads/main'
    # The only job that reads the release signing key. It checks out this
    # repository alone and signs bytes build-production-release-bundle uploaded:
    # no upstream sync, no Gradle, no compiler, no emulator, and no Actions
    # cache, which upstream-running jobs write; setup-signing-tools installs
    # build-tools fresh. Keep it that way;
    # scripts/android/run_signing_isolation_contract.sh fails a secret-holding
    # job that builds or runs upstream code or restores a cache.
    needs:
      - resolve-release-inputs
      - resolve-upstream-core
      - build-production-release-bundle
    environment: production-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared Android defaults
        id: defaults
        shell: bash
        run: |
          set -euo pipefail

          . ./android/r47-defaults.properties

          echo "build_jdk_version=$R47_DEFAULT_ANDROID_BUILD_JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.defaults.outputs.build_jdk_version }}

      - name: Set up the signing tools
        uses: ./.github/actions/setup-signing-tools
        with:
          build-tools-version: ${{ steps.defaults.outputs.build_tools_version }}

      - name: Download unsigned release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.unsigned_artifact_name }}
          path: ci-artifacts/release-unsigned

      - name: Sign release APK and bundle
        shell: bash
        env:
          R47_RELEASE_STORE_FILE_BASE64: ${{ secrets.R47_RELEASE_STORE_FILE_BASE64 }}
          R47_RELEASE_KEY_ALIAS: ${{ secrets.R47_RELEASE_KEY_ALIAS }}
          R47_SIGNING_STORE_PASSWORD: ${{ secrets.R47_RELEASE_STORE_PASSWORD }}
          R47_SIGNING_KEY_PASSWORD: ${{ secrets.R47_RELEASE_KEY_PASSWORD }}
          RELEASE_APK_NAME: ${{ needs.build-production-release-bundle.outputs.release_apk_name }}
          RELEASE_BUNDLE_NAME: ${{ needs.build-production-release-bundle.outputs.release_bundle_name }}
          BUILD_TOOLS_VERSION: ${{ steps.defaults.outputs.build_tools_version }}
        run: |
          set -euo pipefail

          # The names come from a job that ran upstream code; take them as
          # plain file names or not at all.
          if [[ ! "$RELEASE_APK_NAME" =~ ^[A-Za-z0-9._-]+\.apk$ ||
            ! "$RELEASE_BUNDLE_NAME" =~ ^[A-Za-z0-9._-]+\.aab$ ]]; then
            echo "Refusing the release asset names '${RELEASE_APK_NAME}' and '${RELEASE_BUNDLE_NAME}' from build-production-release-bundle." >&2
            exit 1
          fi

          for secret_name in \
            R47_RELEASE_STORE_FILE_BASE64 \
            R47_RELEASE_KEY_ALIAS \
            R47_SIGNING_STORE_PASSWORD \
            R47_SIGNING_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required production release signing secret for ${secret_name}." >&2
              exit 1
            fi
          done

          # The decoded key lives for this step only: the trap removes it on
          # success or failure, and the next step repeats the removal in case
          # the runner killed this shell.
          keystore_path="${RUNNER_TEMP}/r47-release-upload-key.jks"
          trap 'shred -u "$keystore_path" 2>/dev/null || rm -f "$keystore_path"' EXIT
          (
            umask 077
            printf '%s' "$R47_RELEASE_STORE_FILE_BASE64" | base64 --decode > "$keystore_path"
          )

          bash ./scripts/android/sign_android_artifacts.sh \
            --keystore "$keystore_path" \
            --key-alias "$R47_RELEASE_KEY_ALIAS" \
            --build-tools-version "$BUILD_TOOLS_VERSION" \
            --apk ci-artifacts/release-unsigned/app-release-unsigned.apk \
            --apk-out "ci-artifacts/release-signed/${RELEASE_APK_NAME}" \
            --bundle ci-artifacts/release-unsigned/app-release-unsigned.aab \
            --bundle-out "ci-artifacts/release-signed/${RELEASE_BUNDLE_NAME}"

      - name: Shred the decoded release keystore
        if: always()
        shell: bash
        # Hosted runners wipe RUNNER_TEMP, but a reused or self-hosted runner
        # would otherwise keep the private signing key on disk if the signing
        # step was killed before its trap ran. shred overwrites before
        # unlinking; rm is the fallback if shred is absent.
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/r47-release-upload-key.jks"
          if [ -f "$keystore_path" ]; then
            shred -u "$keystore_path" 2>/dev/null || rm -f "$keystore_path"
            echo "Removed decoded release keystore."
          else
            echo "No decoded release keystore to remove."
          fi

      - name: Collect release packaging evidence
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
          RELEASE_APK_NAME: ${{ needs.build-production-release-bundle.outputs.release_apk_name }}
          RELEASE_BUNDLE_NAME: ${{ needs.build-production-release-bundle.outputs.release_bundle_name }}
          UPSTREAM_URL: ${{ needs.resolve-upstream-core.outputs.upstream_url }}
          UPSTREAM_COMMIT: ${{ needs.resolve-upstream-core.outputs.upstream_commit }}
          UPSTREAM_VERSION: ${{ needs.build-production-release-bundle.outputs.upstream_version }}
        run: |
          set -euo pipefail

          . ./android/r47-defaults.properties

          # The upstream version comes from a job that ran upstream code; take
          # it as one plain token or not at all.
          if [[ -n "$UPSTREAM_VERSION" && ! "$UPSTREAM_VERSION" =~ ^[0-9A-Za-z.-]{1,40}$ ]]; then
            echo "Refusing the upstream version '${UPSTREAM_VERSION}' from build-production-release-bundle." >&2
            exit 1
          fi

          bundle_output_dir='ci-artifacts/release-aab'
          apk_output_dir='ci-artifacts/release-apk'
          bundle_path="ci-artifacts/release-signed/${RELEASE_BUNDLE_NAME}"
          release_apk_path="ci-artifacts/release-signed/${RELEASE_APK_NAME}"
          mapping_path='ci-artifacts/release-unsigned/mapping.txt'
          native_symbols_path="$PWD/ci-artifacts/release-unsigned/native-debug-symbols.zip"

          if [[ ! -f "$bundle_path" ]]; then
            echo "Missing release bundle at ${bundle_path}." >&2
            exit 1
          fi
          if [[ ! -f "$release_apk_path" ]]; then
            echo "Missing release APK at ${release_apk_path}." >&2
            exit 1
          fi
          if [[ ! -f "$mapping_path" ]]; then
            echo "Missing release mapping file at ${mapping_path}." >&2
            exit 1
          fi
          if [[ ! -f "$native_symbols_path" ]]; then
            echo "Missing native debug symbols at ${native_symbols_path}." >&2
            exit 1
          fi

          mkdir -p "$bundle_output_dir" "$apk_output_dir"

          # Everything but the artifact itself is the same for both.
          evidence_args=(
            --variant release
            --expected-abis "$R47_DEFAULT_ANDROID_ABI_FILTERS"
            --android-sdk-root "${ANDROID_SDK_ROOT:?}"
            --ndk-version "$R47_DEFAULT_ANDROID_NDK_VERSION"
            --compile-sdk "$R47_DEFAULT_ANDROID_COMPILE_SDK"
            --cmake-version "$R47_DEFAULT_ANDROID_CMAKE_VERSION"
            --android-source-repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --android-source-commit "${GITHUB_SHA}"
            --upstream-source-repository-url "$UPSTREAM_URL"
            --upstream-source-commit "$UPSTREAM_COMMIT"
            --upstream-version "$UPSTREAM_VERSION"
            --xlsxio-source-repository-url "$R47_DEFAULT_XLSXIO_URL"
            --xlsxio-source-commit "$R47_DEFAULT_XLSXIO_COMMIT"
            --application-id "$R47_DEFAULT_ANDROID_APPLICATION_ID"
            --version-code "$R47_VERSION_CODE_INPUT"
            --version-name "$R47_VERSION_NAME_INPUT"
            --signing-mode release
            --ref "${GITHUB_REF}"
            --sha "${GITHUB_SHA}"
            --run-id "${GITHUB_RUN_ID}"
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
            --mapping-file "$mapping_path"
            --native-symbols "$native_symbols_path"
          )

          bash ./scripts/android/collect_packaging_evidence.sh \
            --bundle "$bundle_path" \
            --output-dir "$bundle_output_dir" \
            --artifact-name "$RELEASE_BUNDLE_NAME" \
            "${evidence_args[@]}"

          bash ./scripts/android/collect_packaging_evidence.sh \
            --apk "$release_apk_path" \
            --output-dir "$apk_output_dir" \
            --artifact-name "$RELEASE_APK_NAME" \
            "${evidence_args[@]}"

      - name: Upload signed release AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.artifact_name }}
          path: ci-artifacts/release-aab/
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.apk_artifact_name }}
          path: ci-artifacts/release-apk/
          if-no-files-found: error
          retention-days: 30

  verify-production-release:
    name: Verify production release on the emulator
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve-release-inputs
      - resolve-upstream-core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Configure Git init defaults
        shell: bash
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared Android defaults
        id: defaults
        shell: bash
        run: |
          set -euo pipefail

          . ./android/r47-defaults.properties

          echo "build_jdk_version=$R47_DEFAULT_ANDROID_BUILD_JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "application_id=$R47_DEFAULT_ANDROID_APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "android_test_abi_filters=$R47_DEFAULT_ANDROID_TEST_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$R47_DEFAULT_ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$R47_DEFAULT_ANDROID_CMAKE_VERSION" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$R47_DEFAULT_ANDROID_COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "compile_sdk_minor=$R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR" >> "$GITHUB_OUTPUT"
          echo "android_test_api_level=$R47_DEFAULT_ANDROID_TEST_API_LEVEL" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          echo "abi_filters=$R47_DEFAULT_ANDROID_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "xlsxio_url=$R47_DEFAULT_XLSXIO_URL" >> "$GITHUB_OUTPUT"
          echo "xlsxio_commit=$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"
          echo "xlsxio_prefix=$HOME/.cache/r47/xlsxio/$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Detect runner build concurrency
        id: jobs
        shell: bash
        run: |
          set -euo pipefail

          jobs=$(nproc)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        shell: bash
        run: bash ./scripts/android/install_linux_build_deps.sh

      - name: Set up the pinned build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.defaults.outputs.build_jdk_version }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Set up Android SDK
        id: android-sdk
        uses: ./.github/actions/setup-android-sdk
        with:
          compile-sdk: ${{ steps.defaults.outputs.compile_sdk }}
          compile-sdk-minor: ${{ steps.defaults.outputs.compile_sdk_minor }}
          build-tools-version: ${{ steps.defaults.outputs.build_tools_version }}
          cmake-version: ${{ steps.defaults.outputs.cmake_version }}
          ndk-version: ${{ steps.defaults.outputs.ndk_version }}
          include-emulator: 'true'
          android-test-api-level: ${{ steps.defaults.outputs.android_test_api_level }}

      - name: Generate throwaway verification keystore
        id: release-keystore
        shell: bash
        run: |
          set -euo pipefail

          # The emulator verification lane only needs the release-variant test
          # build to be installable; it signs with a throwaway key generated
          # here, never the production release key. This keeps the production
          # signing material materialized in exactly one place
          # (sign-production-release).
          keystore_path="${RUNNER_TEMP}/r47-verify-throwaway-key.jks"
          keytool -genkeypair -noprompt \
            -keystore "$keystore_path" \
            -storepass throwaway -keypass throwaway \
            -alias verify -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=R47 Verify, O=R47, C=US"
          chmod 600 "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/android/build_android.sh

      - name: Set up xlsxio toolchain
        uses: ./.github/actions/setup-xlsxio-toolchain
        with:
          url: ${{ steps.defaults.outputs.xlsxio_url }}
          commit: ${{ steps.defaults.outputs.xlsxio_commit }}
          prefix: ${{ steps.defaults.outputs.xlsxio_prefix }}
          jobs: ${{ steps.jobs.outputs.jobs }}

      - name: Sync authoritative upstream core
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/upstream-sync/upstream.sh sync --auto --write-lock \
            --url "${{ needs.resolve-upstream-core.outputs.upstream_url }}" \
            --commit "${{ needs.resolve-upstream-core.outputs.upstream_commit }}"
          bash ./scripts/upstream-sync/hydrate_submodules.sh \
            "${{ needs.resolve-upstream-core.outputs.upstream_commit }}" \
            "${{ needs.resolve-upstream-core.outputs.upstream_url }}"
          echo "upstream_url=${{ needs.resolve-upstream-core.outputs.upstream_url }}" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=${{ needs.resolve-upstream-core.outputs.upstream_commit }}" >> "$GITHUB_OUTPUT"

      - name: Build Android release verification artifacts and run JVM tests
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
          R47_RELEASE_STORE_FILE: ${{ steps.release-keystore.outputs.keystore_path }}
          R47_RELEASE_STORE_PASSWORD: throwaway
          R47_RELEASE_KEY_ALIAS: verify
          R47_RELEASE_KEY_PASSWORD: throwaway
          GRADLE_OPTS: -Dorg.gradle.workers.max=${{ steps.jobs.outputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/logs

          cd android
          ./gradlew --max-workers "${{ steps.jobs.outputs.jobs }}" \
            lint \
            :app:assembleRelease \
            :app:assembleReleaseAndroidTest \
            -Pr47.includeInstrumentationHost=true \
            :app:testReleaseUnitTest \
            --daemon --stacktrace --console=plain --warning-mode all \
            -Pr47.releaseMinify=false \
            -Pr47.releaseShrinkResources=false \
            -Pr47.ndkVersion=${{ steps.defaults.outputs.ndk_version }} \
            -Pr47.testBuildType=release \
            -Pr47.versionCode="$R47_VERSION_CODE_INPUT" \
            -Pr47.versionName="$R47_VERSION_NAME_INPUT" \
            -Pr47.coreVersion=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.sourceRepositoryUrl=${{ github.server_url }}/${{ github.repository }} \
            -Pr47.sourceCommit=${{ github.sha }} \
            -Pr47.upstreamSourceRepositoryUrl=${{ steps.upstream.outputs.upstream_url }} \
            -Pr47.upstreamSourceCommit=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.xlsxioSourceRepositoryUrl=${{ steps.defaults.outputs.xlsxio_url }} \
            -Pr47.xlsxioSourceCommit=${{ steps.defaults.outputs.xlsxio_commit }} \
            2>&1 | tee ../ci-artifacts/logs/android-release-verification.log

      - name: Restore Android emulator AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-android-avd-${{ steps.defaults.outputs.android_test_api_level }}-default-x86_64-pixel_7-v1

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          set -euo pipefail

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create Android emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.defaults.outputs.android_test_api_level }}
          target: default
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: ./android
          script: echo "Generated Android emulator snapshot."

      - name: Run Android release instrumentation tests on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          R47_CONNECTED_ANDROID_TEST_JOBS: ${{ steps.jobs.outputs.jobs }}
          R47_CONNECTED_ANDROID_TEST_NDK_VERSION: ${{ steps.defaults.outputs.ndk_version }}
          R47_CONNECTED_ANDROID_TEST_ABI_FILTERS: ${{ steps.defaults.outputs.android_test_abi_filters }}
          R47_CONNECTED_ANDROID_TEST_RELEASE_CHANNEL: prod
          R47_CONNECTED_ANDROID_TEST_BUILD_TYPE: release
          R47_CONNECTED_ANDROID_TEST_RELEASE_MINIFY: 'false'
          R47_CONNECTED_ANDROID_TEST_RELEASE_SHRINK_RESOURCES: 'false'
          R47_CONNECTED_ANDROID_ENABLE_CONFIGURATION_CACHE: 'true'
          R47_CONNECTED_ANDROID_FIXTURE_TIMEOUT: 3m
          R47_CONNECTED_ANDROID_FIXTURE_KILL_AFTER: 20s
          R47_CONNECTED_ANDROID_USE_DAEMON: 'true'
          R47_RELEASE_STORE_FILE: ${{ steps.release-keystore.outputs.keystore_path }}
          R47_RELEASE_STORE_PASSWORD: throwaway
          R47_RELEASE_KEY_ALIAS: verify
          R47_RELEASE_KEY_PASSWORD: throwaway
          R47_CONNECTED_ANDROID_TEST_CORE_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          R47_CONNECTED_ANDROID_TEST_SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          R47_CONNECTED_ANDROID_TEST_SOURCE_COMMIT: ${{ github.sha }}
          R47_CONNECTED_ANDROID_TEST_UPSTREAM_SOURCE_REPOSITORY_URL: ${{ steps.upstream.outputs.upstream_url }}
          R47_CONNECTED_ANDROID_TEST_UPSTREAM_SOURCE_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          R47_CONNECTED_ANDROID_TEST_XLSXIO_SOURCE_REPOSITORY_URL: ${{ steps.defaults.outputs.xlsxio_url }}
          R47_CONNECTED_ANDROID_TEST_XLSXIO_SOURCE_COMMIT: ${{ steps.defaults.outputs.xlsxio_commit }}
        with:
          api-level: ${{ steps.defaults.outputs.android_test_api_level }}
          target: default
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: ./android
          script: >-
            bash --noprofile --norc ../scripts/android/run_connected_android_tests.sh

  verify-signed-artifacts:
    name: Verify signed release artifacts
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve-release-inputs
      - build-production-release-bundle
      - sign-production-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/android/verify_published_release_artifacts.sh

      - name: Download signed release APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.apk_artifact_name }}
          path: release-apk

      - name: Download signed release AAB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.artifact_name }}
          path: release-aab

      - name: Verify signed artifacts match recorded evidence
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
        run: |
          set -euo pipefail

          # Single source of truth for the shipped ABI and the signer: the
          # defaults the app is built with. The release APK carries only that
          # ABI; the x86_64-capable instrumentation build in
          # verify-production-release is a separate emulator vehicle, not the
          # shipped artifact. publish-production-release downloads these same
          # two artifacts and needs this job, so the bytes checked here are the
          # bytes it attaches. The signer pin is tracked, so a key rotation is
          # a commit, and the verifier refuses to run without it.
          . ./android/r47-defaults.properties

          bash ./scripts/android/verify_published_release_artifacts.sh \
            --apk-evidence-dir release-apk \
            --aab-evidence-dir release-aab \
            --expected-version-code "$R47_VERSION_CODE_INPUT" \
            --expected-version-name "$R47_VERSION_NAME_INPUT" \
            --expected-apk-abis "$R47_DEFAULT_ANDROID_ABI_FILTERS" \
            --expected-signing-mode release \
            --expected-cert-sha256 "$R47_DEFAULT_RELEASE_SIGNER_CERT_SHA256"

  publish-production-release:
    name: Publish production GitHub release
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve-release-inputs
      - build-production-release-bundle
      - sign-production-release
      - verify-production-release
      - verify-signed-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # SLSA build-provenance attestation needs an OIDC token to sign and write
      # access to the attestations store.
      id-token: write
      attestations: write
    steps:
      - name: Download release AAB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.artifact_name }}
          path: release-aab

      - name: Download release APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.apk_artifact_name }}
          path: release-apk

      - name: Pack release evidence archives
        id: evidence
        shell: bash
        run: |
          set -euo pipefail

          aab_name=$(sed -n 's/^artifact_name=//p' release-aab/BUILD-METADATA.txt)
          apk_name=$(sed -n 's/^artifact_name=//p' release-apk/BUILD-METADATA.txt)

          if [[ -z "$aab_name" || -z "$apk_name" ]]; then
            echo "Release build metadata did not contain both artifact names." >&2
            exit 1
          fi

          # Disambiguate by artifact type: the APK and AAB share the
          # r47zen_<version>_<upstream8>_<android8> stem, so stripping only the
          # extension would give both the same evidence name, and one archive
          # would overwrite the other on upload.
          aab_evidence_archive_name="${aab_name%.aab}_aab-packaging-evidence.zip"
          apk_evidence_archive_name="${apk_name%.apk}_apk-packaging-evidence.zip"

          rm -f "release-aab/${aab_evidence_archive_name}" "release-apk/${apk_evidence_archive_name}"
          (
            cd release-aab
            zip -qr "$aab_evidence_archive_name" \
              BUILD-METADATA.txt \
              PACKAGED-COMPLIANCE-ASSETS.txt \
              SHA256SUMS.txt \
              mapping.txt \
              native-debug-symbols.zip \
              compliance-assets
          )
          (
            cd release-apk
            zip -qr "$apk_evidence_archive_name" \
              BUILD-METADATA.txt \
              PACKAGED-COMPLIANCE-ASSETS.txt \
              SHA256SUMS.txt \
              abis.txt \
              zipalign.txt \
              elf-load-segments.txt \
              mapping.txt \
              native-debug-symbols.zip \
              compliance-assets
          )

          echo "aab_evidence_archive_name=${aab_evidence_archive_name}" >> "$GITHUB_OUTPUT"
          echo "apk_evidence_archive_name=${apk_evidence_archive_name}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the published artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Attest the exact signed bytes that ship on the GitHub release, and
          # the two packaging-evidence archives that document them, so a
          # consumer can verify they were produced by THIS workflow, not merely
          # somewhere in this repo:
          #   gh attestation verify <file> --repo ${{ github.repository }} \
          #     --signer-workflow ${{ github.repository }}/.github/workflows/android-release.yml
          subject-path: |
            release-apk/*.apk
            release-aab/*.aab
            release-apk/*packaging-evidence.zip
            release-aab/*packaging-evidence.zip

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/android-release.yml
        shell: bash
        run: |
          set -euo pipefail

          # Re-verify the attestation just produced for each shipped artifact, so
          # a broken, unsigned, or missing provenance fails the release in the
          # same run instead of being discovered after publication. Bind to this
          # workflow's identity so an attestation produced by any OTHER workflow
          # in the repo cannot satisfy the check.
          for artifact in release-apk/*.apk release-aab/*.aab \
            release-apk/*packaging-evidence.zip release-aab/*packaging-evidence.zip; do
            echo "Verifying build provenance for ${artifact}"
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${SIGNER_WORKFLOW}"
          done

      - name: Write release notes
        shell: bash
        env:
          R47_RELEASE_MODE: ${{ needs.resolve-release-inputs.outputs.release_mode }}
          R47_RELEASE_TAG: ${{ needs.resolve-release-inputs.outputs.release_tag }}
          R47_PREVIOUS_RELEASE_TAG: ${{ needs.resolve-release-inputs.outputs.previous_release_tag }}
          R47_PREVIOUS_SIGNING_CERT: ${{ needs.resolve-release-inputs.outputs.previous_signing_cert_sha256 }}
          APK_EVIDENCE_ARCHIVE_NAME: ${{ steps.evidence.outputs.apk_evidence_archive_name }}
          AAB_EVIDENCE_ARCHIVE_NAME: ${{ steps.evidence.outputs.aab_evidence_archive_name }}
        run: |
          set -euo pipefail

          upstream_commit=$(sed -n 's/^upstream_commit=//p' release-aab/BUILD-METADATA.txt)
          upstream_url=$(sed -n 's/^upstream_url=//p' release-aab/BUILD-METADATA.txt)
          upstream_version=$(sed -n 's/^upstream_version=//p' release-aab/BUILD-METADATA.txt)
          android_commit=$(sed -n 's/^android_source_commit=//p' release-aab/BUILD-METADATA.txt)
          version_name=$(sed -n 's/^version_name=//p' release-aab/BUILD-METADATA.txt)
          version_code=$(sed -n 's/^version_code=//p' release-aab/BUILD-METADATA.txt)
          xlsxio_commit=$(sed -n 's/^xlsxio_commit=//p' release-aab/BUILD-METADATA.txt)
          xlsxio_url=$(sed -n 's/^xlsxio_url=//p' release-aab/BUILD-METADATA.txt)
          aab_name=$(sed -n 's/^artifact_name=//p' release-aab/BUILD-METADATA.txt)
          apk_name=$(sed -n 's/^artifact_name=//p' release-apk/BUILD-METADATA.txt)
          signer_cert=$(sed -n 's/^artifact_signing_cert_sha256=//p' release-apk/BUILD-METADATA.txt)
          upstream_short_commit="${upstream_commit:0:8}"
          android_short_commit="${android_commit:0:8}"
          core_label=""
          if [[ -n "$upstream_version" ]]; then
            core_label=" (C47 ${upstream_version})"
          fi

          cat > release-notes.md <<EOF
          - Release tag ${R47_RELEASE_TAG}
          - Android version ${version_name} (${version_code})
          - Sync to commit [${upstream_short_commit}](${upstream_url}/-/commit/${upstream_commit})${core_label}
          - Build Android overlay commit [${android_short_commit}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${android_commit})
          - Signing certificate SHA-256 ${signer_cert}

          EOF

          # A signer change is the one thing an existing install cannot
          # survive: Android refuses the update. verify-signed-artifacts
          # held signer_cert to the tracked pin; the previous release's comes
          # from its own evidence.
          if [[ -n "$R47_PREVIOUS_SIGNING_CERT" && "$R47_PREVIOUS_SIGNING_CERT" != "$signer_cert" ]]; then
            cat >> release-notes.md <<EOF
          **Reinstall required.** This release is signed by a different
          certificate than ${R47_PREVIOUS_RELEASE_TAG} (SHA-256
          ${R47_PREVIOUS_SIGNING_CERT}). Android refuses to update an install
          signed by that certificate: uninstall it, which deletes the app's
          data, then install this APK.

          EOF
          fi

          cat >> release-notes.md <<EOF
          This release contains the signed production APK ${apk_name} for direct
          installation and the signed production AAB ${aab_name} for Play
          Console upload.

          The release workflow built these assets from the upstream core above
          through the wrapper-owned host-core optimization flow, and checked
          their signer, version, ABIs, and checksums before publishing them.
          Android lint, the release-path JVM tests, and the release-path
          instrumentation tests ran on an emulator against a rebuild of the same
          commit that is not minified and is signed with a throwaway key, not
          against these exact bytes.

          The Linux host toolchain built xlsxio_xlsx2csv from ${xlsxio_url} at
          commit ${xlsxio_commit} to satisfy the upstream font-generation
          contract.

          Included assets:
          - ${apk_name}
          - ${aab_name}
          - ${APK_EVIDENCE_ARCHIVE_NAME}
          - ${AAB_EVIDENCE_ARCHIVE_NAME}

          Notes:
          - This GitHub release was published from the ${R47_RELEASE_MODE} signed
            release lane.
          - The APK is the GitHub-distributed installable artifact for direct
            sideload updates.
          - The AAB is the Play Console upload artifact.
          - If Google Play later distributes builds signed by a different
            Play-held app-signing key, switching from this GitHub APK channel to
            Play delivery can still require reinstall.
          - The evidence archives preserve compliance assets, source provenance,
            signing metadata, and release packaging reports.

          Workflow run:
          https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Create and publish production release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-release-inputs.outputs.release_tag }}
          name: ${{ needs.resolve-release-inputs.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            release-apk/*.apk
            release-aab/*.aab
            release-apk/${{ steps.evidence.outputs.apk_evidence_archive_name }}
            release-aab/${{ steps.evidence.outputs.aab_evidence_archive_name }}
          fail_on_unmatched_files: true
          # Only replace assets on an existing tag when the dispatch explicitly
          # asked for a re-cut; the resolve-release-inputs guard already fails a
          # non-overwrite run whose tag exists, so this is the second half of the
          # same contract at the actual publish point.
          overwrite_files: ${{ inputs.allow_overwrite }}
          prerelease: false
          draft: false
          make_latest: true

      - name: Summarize the release
        shell: bash
        env:
          R47_RELEASE_TAG: ${{ needs.resolve-release-inputs.outputs.release_tag }}
          R47_PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          set -euo pipefail

          version_name=$(sed -n 's/^version_name=//p' release-aab/BUILD-METADATA.txt)
          version_code=$(sed -n 's/^version_code=//p' release-aab/BUILD-METADATA.txt)
          signer_cert=$(sed -n 's/^artifact_signing_cert_sha256=//p' release-apk/BUILD-METADATA.txt)
          IFS=. read -r major minor patch <<<"$version_name"
          {
            echo "### R47 Zen ${version_name} (${version_code})"
            echo
            echo "- GitHub release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${R47_RELEASE_TAG}"
            echo "- Signing certificate SHA-256: \`${signer_cert}\`"
            if [[ "$R47_PLAY_TRACK" == "none" ]]; then
              echo "- Google Play: not uploaded (play_track none)"
            else
              echo "- Google Play: the \`upload-to-play\` job sends the AAB to the \`${R47_PLAY_TRACK}\` track"
            fi
            echo "- Next: commit the next release in \`android/r47-defaults.properties\`: \`R47_DEFAULT_ANDROID_VERSION_CODE=$((version_code + 1))\` and \`R47_DEFAULT_ANDROID_VERSION_NAME=${major}.${minor}.$((patch + 1))\` (\`${major}.$((minor + 1)).0\` once app code changes)"
          } >> "$GITHUB_STEP_SUMMARY"

  upload-to-play:
    name: Upload signed AAB to Google Play
    if: github.ref == 'refs/heads/main' && inputs.play_track != 'none'
    needs:
      - resolve-release-inputs
      - build-production-release-bundle
      - publish-production-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job bound to play-upload. The Google Cloud provider admits a
    # token from this environment of this workflow on main and nothing else,
    # and the job holds no secret: it signs nothing and exchanges its OIDC
    # token for a short-lived token of the Play upload service account.
    environment: play-upload
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      # The auth action writes its credentials file into the workspace, which
      # exists only after a checkout.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed release AAB artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-production-release-bundle.outputs.artifact_name }}
          path: release-aab

      - name: Verify the AAB is the attested release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/android-release.yml
        shell: bash
        run: |
          set -euo pipefail

          # Send Play only the bytes publish-production-release attested.
          shopt -s nullglob
          bundles=(release-aab/*.aab)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "Expected exactly one AAB in the release artifact, found ${#bundles[@]}." >&2
            exit 1
          fi
          gh attestation verify "${bundles[0]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}"

      - name: Prepare the Play release
        id: play
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_PLAY_RELEASE_NOTES: ${{ inputs.play_release_notes }}
          R47_PLAY_WIF_PROVIDER: ${{ vars.R47_PLAY_WIF_PROVIDER }}
          R47_PLAY_SERVICE_ACCOUNT: ${{ vars.R47_PLAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [[ -z "$R47_PLAY_WIF_PROVIDER" || -z "$R47_PLAY_SERVICE_ACCOUNT" ]]; then
            echo "The play-upload environment lacks R47_PLAY_WIF_PROVIDER or R47_PLAY_SERVICE_ACCOUNT; scripts/android/setup_play_upload_identity.sh prints both." >&2
            exit 1
          fi

          . ./android/r47-defaults.properties
          version_name=$(sed -n 's/^version_name=//p' release-aab/BUILD-METADATA.txt)
          version_code=$(sed -n 's/^version_code=//p' release-aab/BUILD-METADATA.txt)
          upstream_commit=$(sed -n 's/^upstream_commit=//p' release-aab/BUILD-METADATA.txt)
          upstream_version=$(sed -n 's/^upstream_version=//p' release-aab/BUILD-METADATA.txt)
          android_commit=$(sed -n 's/^android_source_commit=//p' release-aab/BUILD-METADATA.txt)
          if [[ "$version_code" != "$R47_VERSION_CODE_INPUT" ]]; then
            echo "The AAB records version_code '$version_code', the run resolved '$R47_VERSION_CODE_INPUT'." >&2
            exit 1
          fi

          notes="$R47_PLAY_RELEASE_NOTES"
          if [[ -z "$notes" && -n "$upstream_version" ]]; then
            notes="R47 Zen ${version_name}. Calculator core C47 ${upstream_version} (${upstream_commit:0:8})."
          elif [[ -z "$notes" ]]; then
            notes="R47 Zen ${version_name}. Calculator core commit ${upstream_commit:0:8}."
          fi
          # Play refuses release notes over 500 characters per language.
          if [[ "${#notes}" -gt 500 ]]; then
            echo "play_release_notes is ${#notes} characters; Play accepts at most 500." >&2
            exit 1
          fi
          mkdir -p play-whatsnew
          printf '%s\n' "$notes" > play-whatsnew/whatsnew-en-US

          bundles=(release-aab/*.aab)
          {
            echo "package_name=${R47_DEFAULT_ANDROID_APPLICATION_ID}"
            # The release name shows only in Play Console, never to users.
            echo "release_name=${version_name} (${version_code}) core ${upstream_commit:0:8} overlay ${android_commit:0:8}"
            echo "bundle_path=${bundles[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.R47_PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.R47_PLAY_SERVICE_ACCOUNT }}

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: ${{ steps.play.outputs.package_name }}
          releaseFiles: ${{ steps.play.outputs.bundle_path }}
          tracks: ${{ inputs.play_track }}
          releaseName: ${{ steps.play.outputs.release_name }}
          status: completed
          whatsNewDirectory: play-whatsnew
          mappingFile: release-aab/mapping.txt
          debugSymbols: release-aab/native-debug-symbols.zip

      - name: Summarize the Play upload
        shell: bash
        env:
          R47_PLAY_TRACK: ${{ inputs.play_track }}
          R47_RELEASE_NAME: ${{ steps.play.outputs.release_name }}
        run: |
          set -euo pipefail

          if [[ "$R47_PLAY_TRACK" == "production" ]]; then
            next="Google reviews the release; it reaches every user once approved."
          else
            next="promote it in Play Console when it should reach production."
          fi
          {
            echo "### Google Play"
            echo
            echo "- Uploaded ${R47_RELEASE_NAME} to the \`${R47_PLAY_TRACK}\` track."
            echo "- Next: ${next}"
          } >> "$GITHUB_STEP_SUMMARY"
