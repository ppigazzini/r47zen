name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonic Android versionCode for the Play upload (YYYYMMDDVV)
        required: true
        type: string
      version_name:
        description: Android versionName and derived GitHub tag basis (major.minor.patch-signed.YYYYMMDDVV)
        required: true
        type: string
      upstream_commit:
        description: Optional upstream commit SHA to pin for a roadblock re-release (blank = latest HEAD)
        required: false
        type: string
      allow_overwrite:
        description: Allow re-publishing over an existing release tag (default false; only for a deliberate re-cut)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-inputs:
    name: Resolve release version inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_code: ${{ steps.resolve.outputs.version_code }}
      version_name: ${{ steps.resolve.outputs.version_name }}
      release_mode: ${{ steps.resolve.outputs.release_mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version inputs
        id: resolve
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ inputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ inputs.version_name }}
          R47_ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          set -euo pipefail

          version_code="$R47_VERSION_CODE_INPUT"
          version_name="$R47_VERSION_NAME_INPUT"
          release_mode="manual"

          case "$version_code" in
            ''|*[!0-9]*)
              echo "version_code must be a positive integer." >&2
              exit 1
              ;;
          esac

          if [[ "$version_code" -lt 1 ]]; then
            echo "version_code must be greater than zero." >&2
            exit 1
          fi

          # Strict format: major.minor.patch-signed.YYYYMMDD[VV], matching every
          # published signed tag. This rejects the typo class that already
          # shipped a malformed tag (r47zen-version-0.1.6-signed.2026061101, from
          # a "version-0.1.6" input) before it can pollute the tag namespace.
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+-signed\.[0-9]{8,10}$ ]]; then
            echo "version_name '$version_name' is malformed; expected major.minor.patch-signed.YYYYMMDD[VV] (e.g. 0.1.6-signed.2026061101)." >&2
            exit 1
          fi

          # Refuse to re-publish over an existing release tag. The publish step
          # builds the LATEST upstream HEAD and uses overwrite_files, so re-running
          # the dispatch with the same version_name on a later day would replace
          # the already-published signed bytes under the same tag with a different
          # core, silently invalidating every recorded SHA256. Derive the tag the
          # same way the metadata step does and fail unless allow_overwrite is set
          # for a deliberate re-cut.
          release_version_token=$(printf '%s' "$version_name" | sed -e 's/[^0-9A-Za-z._-]/-/g' -e 's/^-*//' -e 's/-*$//')
          release_version_token="${release_version_token#[Vv]}"
          release_tag="r47zen-v${release_version_token}"
          if [[ "$R47_ALLOW_OVERWRITE" != "true" ]]; then
            # ls-remote returns 0 when the tag exists and 2 when it does not;
            # any other code is a network/auth error. Fail closed on both "exists"
            # and "error" so a transient failure never opens the overwrite gate.
            # (`set -e` does not fire inside a condition, so branch on the code.)
            ls_remote_status=0
            git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1 || ls_remote_status=$?
            if [[ "$ls_remote_status" -eq 0 ]]; then
              echo "Release tag ${release_tag} already exists; refusing to overwrite a published release. Re-run with allow_overwrite=true only for a deliberate re-cut." >&2
              exit 1
            elif [[ "$ls_remote_status" -ne 2 ]]; then
              echo "Could not determine whether ${release_tag} exists (git ls-remote exit ${ls_remote_status}); refusing to proceed rather than risk overwriting a published release." >&2
              exit 1
            fi
          else
            echo "allow_overwrite=true: proceeding even if ${release_tag} already exists." >&2
          fi

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_mode=$release_mode" >> "$GITHUB_OUTPUT"

  resolve-upstream-core:
    name: Resolve authoritative upstream core revision
    uses: ./.github/workflows/resolve-upstream-core.yml
    with:
      # Release the latest upstream HEAD, same as CI. The resolved commit is
      # recorded in the release tag and BUILD-METADATA for traceability. To hold
      # or reproduce an older revision (a roadblock re-release), supply the
      # upstream_commit dispatch input; resolution then locks to that commit.
      mode: latest
      upstream_commit: ${{ inputs.upstream_commit }}

  build-production-release-bundle:
    name: Build unsigned production release assets
    if: github.ref == 'refs/heads/main'
    # This job syncs, compiles, and runs the unpinned upstream core, so it holds
    # no signing input: no environment, no secret, no keystore. A compile step
    # can embed any readable file into the shipped library, and upstream test
    # code runs with this job's environment. sign-production-release signs the
    # bytes this job uploads on a fresh runner that executes none of it.
    needs:
      - resolve-release-inputs
      - resolve-upstream-core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      unsigned_artifact_name: ${{ steps.meta.outputs.unsigned_artifact_name }}
      apk_artifact_name: ${{ steps.meta.outputs.apk_artifact_name }}
      release_bundle_name: ${{ steps.meta.outputs.release_bundle_name }}
      release_apk_name: ${{ steps.meta.outputs.release_apk_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
    steps:
      - name: Configure Git init defaults
        shell: bash
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared Android defaults
        id: defaults
        shell: bash
        run: |
          set -euo pipefail

          . ./android/r47-defaults.properties

          echo "build_jdk_version=$R47_DEFAULT_ANDROID_BUILD_JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "application_id=$R47_DEFAULT_ANDROID_APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "android_test_abi_filters=$R47_DEFAULT_ANDROID_TEST_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$R47_DEFAULT_ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$R47_DEFAULT_ANDROID_CMAKE_VERSION" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$R47_DEFAULT_ANDROID_COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "compile_sdk_minor=$R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR" >> "$GITHUB_OUTPUT"
          echo "android_test_api_level=$R47_DEFAULT_ANDROID_TEST_API_LEVEL" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          echo "abi_filters=$R47_DEFAULT_ANDROID_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "xlsxio_url=$R47_DEFAULT_XLSXIO_URL" >> "$GITHUB_OUTPUT"
          echo "xlsxio_commit=$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"
          echo "xlsxio_prefix=$HOME/.cache/r47/xlsxio/$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Detect runner build concurrency
        id: jobs
        shell: bash
        run: |
          set -euo pipefail

          jobs=$(nproc)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        shell: bash
        run: bash ./scripts/android/install_linux_build_deps.sh

      - name: Set up the pinned build JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.defaults.outputs.build_jdk_version }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Set up Android SDK
        id: android-sdk
        uses: ./.github/actions/setup-android-sdk
        with:
          compile-sdk: ${{ steps.defaults.outputs.compile_sdk }}
          compile-sdk-minor: ${{ steps.defaults.outputs.compile_sdk_minor }}
          build-tools-version: ${{ steps.defaults.outputs.build_tools_version }}
          cmake-version: ${{ steps.defaults.outputs.cmake_version }}
          ndk-version: ${{ steps.defaults.outputs.ndk_version }}
          include-emulator: 'true'
          android-test-api-level: ${{ steps.defaults.outputs.android_test_api_level }}

      - name: Install matching host LLVM profiling runtime
        shell: bash
        run: |
          set -euo pipefail

          ndk_root="${{ steps.android-sdk.outputs.sdk_root }}/ndk/${{ steps.defaults.outputs.ndk_version }}"
          clang_bin="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          llvm_major="$($clang_bin --version | sed -nE '1s/.*clang version ([0-9]+).*/\1/p')"

          if [[ -z "$llvm_major" ]]; then
            echo "Failed to determine LLVM major version from $clang_bin" >&2
            exit 1
          fi

          bash ./scripts/android/install_host_llvm_toolchain.sh "$llvm_major"

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/android/build_android.sh

      - name: Set up xlsxio toolchain
        uses: ./.github/actions/setup-xlsxio-toolchain
        with:
          url: ${{ steps.defaults.outputs.xlsxio_url }}
          commit: ${{ steps.defaults.outputs.xlsxio_commit }}
          prefix: ${{ steps.defaults.outputs.xlsxio_prefix }}
          jobs: ${{ steps.jobs.outputs.jobs }}

      - name: Sync authoritative upstream core
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/upstream-sync/upstream.sh sync --auto --write-lock \
            --url "${{ needs.resolve-upstream-core.outputs.upstream_url }}" \
            --commit "${{ needs.resolve-upstream-core.outputs.upstream_commit }}"
          bash ./scripts/upstream-sync/hydrate_submodules.sh \
            "${{ needs.resolve-upstream-core.outputs.upstream_commit }}" \
            "${{ needs.resolve-upstream-core.outputs.upstream_url }}"
          echo "upstream_url=${{ needs.resolve-upstream-core.outputs.upstream_url }}" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=${{ needs.resolve-upstream-core.outputs.upstream_commit }}" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: meta
        shell: bash
        env:
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
        run: |
          set -euo pipefail

          eval "$(bash ./scripts/android/resolve_android_artifact_metadata.sh \
            --upstream-commit "${{ steps.upstream.outputs.upstream_commit }}" \
            --android-commit "${{ github.sha }}")"

          release_version_token=$(printf '%s' "$R47_VERSION_NAME_INPUT" | sed -e 's/[^0-9A-Za-z._-]/-/g' -e 's/^-*//' -e 's/-*$//')
          release_version_token="${release_version_token#[Vv]}"
          if [[ -z "$release_version_token" ]]; then
            echo "version_name did not contain any characters suitable for a GitHub release tag." >&2
            exit 1
          fi

          echo "artifact_name=$R47_ANDROID_RELEASE_ARTIFACT_STEM" >> "$GITHUB_OUTPUT"
          echo "apk_artifact_name=${R47_ANDROID_RELEASE_ARTIFACT_STEM}-apk" >> "$GITHUB_OUTPUT"
          echo "unsigned_artifact_name=${R47_ANDROID_RELEASE_ARTIFACT_STEM}-unsigned" >> "$GITHUB_OUTPUT"
          echo "release_bundle_name=$R47_ANDROID_RELEASE_AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "release_apk_name=$R47_ANDROID_RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=r47zen-v${release_version_token}" >> "$GITHUB_OUTPUT"
          echo "release_title=R47 Zen ${R47_VERSION_NAME_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Prepare staged native inputs and simulator parity
        shell: bash
        env:
          R47_NDK_VERSION: ${{ steps.defaults.outputs.ndk_version }}
          R47_BUILD_JOBS: ${{ steps.jobs.outputs.jobs }}
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ steps.jobs.outputs.jobs }}
          R47_GRADLE_ARGS: '--daemon --stacktrace --console=plain'
          R47_PGO_OUTPUT_DIR: ${{ github.workspace }}/ci-artifacts/pgo
          R47_SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          R47_SOURCE_COMMIT: ${{ github.sha }}
          R47_UPSTREAM_SOURCE_REPOSITORY_URL: ${{ steps.upstream.outputs.upstream_url }}
          R47_UPSTREAM_SOURCE_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          R47_XLSXIO_URL: ${{ steps.defaults.outputs.xlsxio_url }}
          R47_XLSXIO_COMMIT: ${{ steps.defaults.outputs.xlsxio_commit }}
          GRADLE_OPTS: -Dorg.gradle.workers.max=${{ steps.jobs.outputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/logs
          ./scripts/android/build_android.sh \
            --run-sim-tests \
            --collect-host-pgo \
            --validate-release-pgo \
            2>&1 | tee ci-artifacts/logs/build-android-release.log

      - name: Build unsigned release APK and bundle
        shell: bash
        env:
          R47_RELEASE_HOST_PGO_PROFILE: ${{ github.workspace }}/ci-artifacts/pgo/r47-host-core.profdata
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
          GRADLE_OPTS: -Dorg.gradle.workers.max=${{ steps.jobs.outputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/logs

          cd android
          ./gradlew --max-workers "${{ steps.jobs.outputs.jobs }}" \
            :app:assembleRelease \
            :app:bundleRelease \
            --daemon --stacktrace --console=plain --warning-mode all \
            -Pr47.ndkVersion=${{ steps.defaults.outputs.ndk_version }} \
            -Pr47.includeProgramLoadTestBridge=false \
            -Pr47.pgoProfilePath="$R47_RELEASE_HOST_PGO_PROFILE" \
            -Pr47.versionCode="$R47_VERSION_CODE_INPUT" \
            -Pr47.versionName="$R47_VERSION_NAME_INPUT" \
            -Pr47.coreVersion=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.sourceRepositoryUrl=${{ github.server_url }}/${{ github.repository }} \
            -Pr47.sourceCommit=${{ github.sha }} \
            -Pr47.upstreamSourceRepositoryUrl=${{ steps.upstream.outputs.upstream_url }} \
            -Pr47.upstreamSourceCommit=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.xlsxioSourceRepositoryUrl=${{ steps.defaults.outputs.xlsxio_url }} \
            -Pr47.xlsxioSourceCommit=${{ steps.defaults.outputs.xlsxio_commit }} \
            2>&1 | tee ../ci-artifacts/logs/android-release-bundle.log

      - name: Stage unsigned release assets for signing
        shell: bash
        run: |
          set -euo pipefail

          apk_dir='android/app/build/outputs/apk/release'
          bundle_path='android/app/build/outputs/bundle/release/app-release.aab'
          mapping_path='android/app/build/outputs/mapping/release/mapping.txt'
          native_symbols_dir='android/app/build/intermediates/native_debug_metadata/release/extractReleaseNativeDebugMetadata/out'
          staging_dir="$PWD/ci-artifacts/release-unsigned"

          if [[ ! -f "$apk_dir/output-metadata.json" ]]; then
            echo "Missing ${apk_dir}/output-metadata.json." >&2
            exit 1
          fi
          apk_file="$(sed -n 's/.*"outputFile": *"\([^"]*\)".*/\1/p' "$apk_dir/output-metadata.json" | head -n 1)"

          # Fail closed if anything in this job signed: signing material here
          # would share a runner with upstream code.
          if [[ "$apk_file" != *-unsigned.apk ]]; then
            echo "Expected an unsigned release APK, but AGP reports '${apk_file}'." >&2
            exit 1
          fi
          for required in "$apk_dir/$apk_file" "$bundle_path" "$mapping_path"; do
            if [[ ! -f "$required" ]]; then
              echo "Missing release output ${required}." >&2
              exit 1
            fi
          done
          if unzip -Z1 "$bundle_path" | grep -Eq '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$'; then
            echo "Expected an unsigned release bundle, but ${bundle_path} carries a JAR signature." >&2
            exit 1
          fi
          if [[ ! -d "$native_symbols_dir" ]]; then
            echo "Missing native debug metadata directory at ${native_symbols_dir}." >&2
            exit 1
          fi

          mkdir -p "$staging_dir"
          cp "$apk_dir/$apk_file" "$staging_dir/app-release-unsigned.apk"
          cp "$bundle_path" "$staging_dir/app-release-unsigned.aab"
          cp "$mapping_path" "$staging_dir/mapping.txt"
          (
            cd "$native_symbols_dir"
            zip -qr "$staging_dir/native-debug-symbols.zip" .
          )

      - name: Upload release build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-logs
          path: |
            ci-artifacts/logs/
            android/app/build/reports/tests
            android/app/build/test-results
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 30

      - name: Upload host-core PGO artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}-host-core-pgo
          path: |
            ci-artifacts/pgo/
            ci-artifacts/logs/build-android-release.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload unsigned release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.unsigned_artifact_name }}
          path: ci-artifacts/release-unsigned/
          if-no-files-found: error
          retention-days: 7

  sign-production-release:
    name: Sign production release assets
    if: github.ref == 'refs/heads/main'
    # The only job that reads the release signing key. It checks out this
    # repository alone and signs bytes build-production-release-bundle uploaded:
    # no upstream sync, no Gradle, no compiler, no emulator. Keep it that way;
    # scripts/android/run_signing_isolation_contract.sh fails a secret-holding
    # job that builds or runs upstream code.
    needs:
      - resolve-release-inputs
      - resolve-upstream-core
      - build-production-release-bundle
    environment: production-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared Android defaults
        id: defaults
        shell: bash
        run: |
          set -euo pipefail

          . ./android/r47-defaults.properties

          echo "build_jdk_version=$R47_DEFAULT_ANDROID_BUILD_JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "application_id=$R47_DEFAULT_ANDROID_APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$R47_DEFAULT_ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$R47_DEFAULT_ANDROID_CMAKE_VERSION" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$R47_DEFAULT_ANDROID_COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "compile_sdk_minor=$R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          echo "abi_filters=$R47_DEFAULT_ANDROID_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "xlsxio_url=$R47_DEFAULT_XLSXIO_URL" >> "$GITHUB_OUTPUT"
          echo "xlsxio_commit=$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up the pinned build JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.defaults.outputs.build_jdk_version }}

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk
        with:
          compile-sdk: ${{ steps.defaults.outputs.compile_sdk }}
          compile-sdk-minor: ${{ steps.defaults.outputs.compile_sdk_minor }}
          build-tools-version: ${{ steps.defaults.outputs.build_tools_version }}
          cmake-version: ${{ steps.defaults.outputs.cmake_version }}
          ndk-version: ${{ steps.defaults.outputs.ndk_version }}

      - name: Download unsigned release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-production-release-bundle.outputs.unsigned_artifact_name }}
          path: ci-artifacts/release-unsigned

      - name: Sign release APK and bundle
        shell: bash
        env:
          R47_RELEASE_STORE_FILE_BASE64: ${{ secrets.R47_RELEASE_STORE_FILE_BASE64 }}
          R47_RELEASE_KEY_ALIAS: ${{ secrets.R47_RELEASE_KEY_ALIAS }}
          R47_SIGNING_STORE_PASSWORD: ${{ secrets.R47_RELEASE_STORE_PASSWORD }}
          R47_SIGNING_KEY_PASSWORD: ${{ secrets.R47_RELEASE_KEY_PASSWORD }}
          RELEASE_APK_NAME: ${{ needs.build-production-release-bundle.outputs.release_apk_name }}
          RELEASE_BUNDLE_NAME: ${{ needs.build-production-release-bundle.outputs.release_bundle_name }}
          BUILD_TOOLS_VERSION: ${{ steps.defaults.outputs.build_tools_version }}
        run: |
          set -euo pipefail

          for secret_name in \
            R47_RELEASE_STORE_FILE_BASE64 \
            R47_RELEASE_KEY_ALIAS \
            R47_SIGNING_STORE_PASSWORD \
            R47_SIGNING_KEY_PASSWORD
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required production release signing secret for ${secret_name}." >&2
              exit 1
            fi
          done

          # The decoded key lives for this step only: the trap removes it on
          # success or failure, and the next step repeats the removal in case
          # the runner killed this shell.
          keystore_path="${RUNNER_TEMP}/r47-release-upload-key.jks"
          trap 'shred -u "$keystore_path" 2>/dev/null || rm -f "$keystore_path"' EXIT
          (
            umask 077
            printf '%s' "$R47_RELEASE_STORE_FILE_BASE64" | base64 --decode > "$keystore_path"
          )

          bash ./scripts/android/sign_android_artifacts.sh \
            --keystore "$keystore_path" \
            --key-alias "$R47_RELEASE_KEY_ALIAS" \
            --build-tools-version "$BUILD_TOOLS_VERSION" \
            --apk ci-artifacts/release-unsigned/app-release-unsigned.apk \
            --apk-out "ci-artifacts/release-signed/${RELEASE_APK_NAME}" \
            --bundle ci-artifacts/release-unsigned/app-release-unsigned.aab \
            --bundle-out "ci-artifacts/release-signed/${RELEASE_BUNDLE_NAME}"

      - name: Shred the decoded release keystore
        if: always()
        shell: bash
        # Hosted runners wipe RUNNER_TEMP, but a reused or self-hosted runner
        # would otherwise keep the private signing key on disk if the signing
        # step was killed before its trap ran. shred overwrites before
        # unlinking; rm is the fallback if shred is absent.
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/r47-release-upload-key.jks"
          if [ -f "$keystore_path" ]; then
            shred -u "$keystore_path" 2>/dev/null || rm -f "$keystore_path"
            echo "Removed decoded release keystore."
          else
            echo "No decoded release keystore to remove."
          fi

      - name: Collect release packaging evidence
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
        run: |
          set -euo pipefail

          bundle_output_dir='ci-artifacts/release-aab'
          apk_output_dir='ci-artifacts/release-apk'
          bundle_path="ci-artifacts/release-signed/${{ needs.build-production-release-bundle.outputs.release_bundle_name }}"
          release_apk_path="ci-artifacts/release-signed/${{ needs.build-production-release-bundle.outputs.release_apk_name }}"
          mapping_path='ci-artifacts/release-unsigned/mapping.txt'
          native_symbols_path="$PWD/ci-artifacts/release-unsigned/native-debug-symbols.zip"

          if [[ ! -f "$bundle_path" ]]; then
            echo "Missing release bundle at ${bundle_path}." >&2
            exit 1
          fi
          if [[ ! -f "$release_apk_path" ]]; then
            echo "Missing release APK at ${release_apk_path}." >&2
            exit 1
          fi
          if [[ ! -f "$mapping_path" ]]; then
            echo "Missing release mapping file at ${mapping_path}." >&2
            exit 1
          fi
          if [[ ! -f "$native_symbols_path" ]]; then
            echo "Missing native debug symbols at ${native_symbols_path}." >&2
            exit 1
          fi

          mkdir -p "$bundle_output_dir" "$apk_output_dir"

          bash ./scripts/android/collect_packaging_evidence.sh \
            --variant release \
            --bundle "$bundle_path" \
            --output-dir "$bundle_output_dir" \
            --artifact-name "${{ needs.build-production-release-bundle.outputs.release_bundle_name }}" \
            --expected-abis "${{ steps.defaults.outputs.abi_filters }}" \
            --android-sdk-root "${ANDROID_SDK_ROOT:?}" \
            --ndk-version "${{ steps.defaults.outputs.ndk_version }}" \
            --compile-sdk "${{ steps.defaults.outputs.compile_sdk }}" \
            --cmake-version "${{ steps.defaults.outputs.cmake_version }}" \
            --android-source-repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --android-source-commit "${GITHUB_SHA}" \
            --upstream-source-repository-url "${{ needs.resolve-upstream-core.outputs.upstream_url }}" \
            --upstream-source-commit "${{ needs.resolve-upstream-core.outputs.upstream_commit }}" \
            --xlsxio-source-repository-url "${{ steps.defaults.outputs.xlsxio_url }}" \
            --xlsxio-source-commit "${{ steps.defaults.outputs.xlsxio_commit }}" \
            --application-id "${{ steps.defaults.outputs.application_id }}" \
            --version-code "$R47_VERSION_CODE_INPUT" \
            --version-name "$R47_VERSION_NAME_INPUT" \
            --signing-mode release \
            --ref "${GITHUB_REF}" \
            --sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --mapping-file "$mapping_path" \
            --native-symbols "$native_symbols_path"

          bash ./scripts/android/collect_packaging_evidence.sh \
            --variant release \
            --apk "$release_apk_path" \
            --output-dir "$apk_output_dir" \
            --artifact-name "${{ needs.build-production-release-bundle.outputs.release_apk_name }}" \
            --expected-abis "${{ steps.defaults.outputs.abi_filters }}" \
            --android-sdk-root "${ANDROID_SDK_ROOT:?}" \
            --ndk-version "${{ steps.defaults.outputs.ndk_version }}" \
            --compile-sdk "${{ steps.defaults.outputs.compile_sdk }}" \
            --cmake-version "${{ steps.defaults.outputs.cmake_version }}" \
            --android-source-repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --android-source-commit "${GITHUB_SHA}" \
            --upstream-source-repository-url "${{ needs.resolve-upstream-core.outputs.upstream_url }}" \
            --upstream-source-commit "${{ needs.resolve-upstream-core.outputs.upstream_commit }}" \
            --xlsxio-source-repository-url "${{ steps.defaults.outputs.xlsxio_url }}" \
            --xlsxio-source-commit "${{ steps.defaults.outputs.xlsxio_commit }}" \
            --application-id "${{ steps.defaults.outputs.application_id }}" \
            --version-code "$R47_VERSION_CODE_INPUT" \
            --version-name "$R47_VERSION_NAME_INPUT" \
            --signing-mode release \
            --ref "${GITHUB_REF}" \
            --sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --mapping-file "$mapping_path" \
            --native-symbols "$native_symbols_path"

      - name: Upload signed release AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build-production-release-bundle.outputs.artifact_name }}
          path: ci-artifacts/release-aab/
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build-production-release-bundle.outputs.apk_artifact_name }}
          path: ci-artifacts/release-apk/
          if-no-files-found: error
          retention-days: 30

  verify-production-release:
    name: Verify production release on the emulator
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve-release-inputs
      - resolve-upstream-core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Configure Git init defaults
        shell: bash
        run: |
          set -euo pipefail
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared Android defaults
        id: defaults
        shell: bash
        run: |
          set -euo pipefail

          . ./android/r47-defaults.properties

          echo "build_jdk_version=$R47_DEFAULT_ANDROID_BUILD_JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "application_id=$R47_DEFAULT_ANDROID_APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "android_test_abi_filters=$R47_DEFAULT_ANDROID_TEST_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$R47_DEFAULT_ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$R47_DEFAULT_ANDROID_CMAKE_VERSION" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$R47_DEFAULT_ANDROID_COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "compile_sdk_minor=$R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR" >> "$GITHUB_OUTPUT"
          echo "android_test_api_level=$R47_DEFAULT_ANDROID_TEST_API_LEVEL" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"
          echo "abi_filters=$R47_DEFAULT_ANDROID_ABI_FILTERS" >> "$GITHUB_OUTPUT"
          echo "xlsxio_url=$R47_DEFAULT_XLSXIO_URL" >> "$GITHUB_OUTPUT"
          echo "xlsxio_commit=$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"
          echo "xlsxio_prefix=$HOME/.cache/r47/xlsxio/$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Detect runner build concurrency
        id: jobs
        shell: bash
        run: |
          set -euo pipefail

          jobs=$(nproc)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        shell: bash
        run: bash ./scripts/android/install_linux_build_deps.sh

      - name: Set up the pinned build JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.defaults.outputs.build_jdk_version }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Set up Android SDK
        id: android-sdk
        uses: ./.github/actions/setup-android-sdk
        with:
          compile-sdk: ${{ steps.defaults.outputs.compile_sdk }}
          compile-sdk-minor: ${{ steps.defaults.outputs.compile_sdk_minor }}
          build-tools-version: ${{ steps.defaults.outputs.build_tools_version }}
          cmake-version: ${{ steps.defaults.outputs.cmake_version }}
          ndk-version: ${{ steps.defaults.outputs.ndk_version }}
          include-emulator: 'true'
          android-test-api-level: ${{ steps.defaults.outputs.android_test_api_level }}

      - name: Generate throwaway verification keystore
        id: release-keystore
        shell: bash
        run: |
          set -euo pipefail

          # The emulator verification lane only needs the release-variant test
          # build to be installable; it signs with a throwaway key generated
          # here, never the production release key. This keeps the production
          # signing material materialized in exactly one place
          # (sign-production-release).
          keystore_path="${RUNNER_TEMP}/r47-verify-throwaway-key.jks"
          keytool -genkeypair -noprompt \
            -keystore "$keystore_path" \
            -storepass throwaway -keypass throwaway \
            -alias verify -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=R47 Verify, O=R47, C=US"
          chmod 600 "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/android/build_android.sh

      - name: Set up xlsxio toolchain
        uses: ./.github/actions/setup-xlsxio-toolchain
        with:
          url: ${{ steps.defaults.outputs.xlsxio_url }}
          commit: ${{ steps.defaults.outputs.xlsxio_commit }}
          prefix: ${{ steps.defaults.outputs.xlsxio_prefix }}
          jobs: ${{ steps.jobs.outputs.jobs }}

      - name: Sync authoritative upstream core
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/upstream-sync/upstream.sh sync --auto --write-lock \
            --url "${{ needs.resolve-upstream-core.outputs.upstream_url }}" \
            --commit "${{ needs.resolve-upstream-core.outputs.upstream_commit }}"
          bash ./scripts/upstream-sync/hydrate_submodules.sh \
            "${{ needs.resolve-upstream-core.outputs.upstream_commit }}" \
            "${{ needs.resolve-upstream-core.outputs.upstream_url }}"
          echo "upstream_url=${{ needs.resolve-upstream-core.outputs.upstream_url }}" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=${{ needs.resolve-upstream-core.outputs.upstream_commit }}" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: meta
        shell: bash
        env:
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
        run: |
          set -euo pipefail

          eval "$(bash ./scripts/android/resolve_android_artifact_metadata.sh \
            --upstream-commit "${{ steps.upstream.outputs.upstream_commit }}" \
            --android-commit "${{ github.sha }}")"

          release_version_token=$(printf '%s' "$R47_VERSION_NAME_INPUT" | sed -e 's/[^0-9A-Za-z._-]/-/g' -e 's/^-*//' -e 's/-*$//')
          release_version_token="${release_version_token#[Vv]}"
          if [[ -z "$release_version_token" ]]; then
            echo "version_name did not contain any characters suitable for a GitHub release tag." >&2
            exit 1
          fi

          echo "artifact_name=$R47_ANDROID_RELEASE_ARTIFACT_STEM" >> "$GITHUB_OUTPUT"
          echo "apk_artifact_name=${R47_ANDROID_RELEASE_ARTIFACT_STEM}-apk" >> "$GITHUB_OUTPUT"
          echo "release_bundle_name=$R47_ANDROID_RELEASE_AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "release_apk_name=$R47_ANDROID_RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=r47zen-v${release_version_token}" >> "$GITHUB_OUTPUT"
          echo "release_title=R47 Zen ${R47_VERSION_NAME_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Build Android release verification artifacts and run JVM tests
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
          R47_RELEASE_STORE_FILE: ${{ steps.release-keystore.outputs.keystore_path }}
          R47_RELEASE_STORE_PASSWORD: throwaway
          R47_RELEASE_KEY_ALIAS: verify
          R47_RELEASE_KEY_PASSWORD: throwaway
          GRADLE_OPTS: -Dorg.gradle.workers.max=${{ steps.jobs.outputs.jobs }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/logs

          cd android
          ./gradlew --max-workers "${{ steps.jobs.outputs.jobs }}" \
            lint \
            :app:assembleRelease \
            :app:assembleReleaseAndroidTest \
            :app:testReleaseUnitTest \
            --daemon --stacktrace --console=plain --warning-mode all \
            -Pr47.releaseMinify=false \
            -Pr47.releaseShrinkResources=false \
            -Pr47.ndkVersion=${{ steps.defaults.outputs.ndk_version }} \
            -Pr47.testBuildType=release \
            -Pr47.versionCode="$R47_VERSION_CODE_INPUT" \
            -Pr47.versionName="$R47_VERSION_NAME_INPUT" \
            -Pr47.coreVersion=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.sourceRepositoryUrl=${{ github.server_url }}/${{ github.repository }} \
            -Pr47.sourceCommit=${{ github.sha }} \
            -Pr47.upstreamSourceRepositoryUrl=${{ steps.upstream.outputs.upstream_url }} \
            -Pr47.upstreamSourceCommit=${{ steps.upstream.outputs.upstream_commit }} \
            -Pr47.xlsxioSourceRepositoryUrl=${{ steps.defaults.outputs.xlsxio_url }} \
            -Pr47.xlsxioSourceCommit=${{ steps.defaults.outputs.xlsxio_commit }} \
            2>&1 | tee ../ci-artifacts/logs/android-release-verification.log

      - name: Restore Android emulator AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-android-avd-${{ steps.defaults.outputs.android_test_api_level }}-default-x86_64-pixel_7-v1

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          set -euo pipefail

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create Android emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.defaults.outputs.android_test_api_level }}
          target: default
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: ./android
          script: echo "Generated Android emulator snapshot."

      - name: Run Android release instrumentation tests on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          R47_CONNECTED_ANDROID_TEST_JOBS: ${{ steps.jobs.outputs.jobs }}
          R47_CONNECTED_ANDROID_TEST_NDK_VERSION: ${{ steps.defaults.outputs.ndk_version }}
          R47_CONNECTED_ANDROID_TEST_ABI_FILTERS: ${{ steps.defaults.outputs.android_test_abi_filters }}
          R47_CONNECTED_ANDROID_TEST_RELEASE_CHANNEL: prod
          R47_CONNECTED_ANDROID_TEST_BUILD_TYPE: release
          R47_CONNECTED_ANDROID_TEST_RELEASE_MINIFY: 'false'
          R47_CONNECTED_ANDROID_TEST_RELEASE_SHRINK_RESOURCES: 'false'
          R47_CONNECTED_ANDROID_ENABLE_CONFIGURATION_CACHE: 'true'
          R47_CONNECTED_ANDROID_FIXTURE_TIMEOUT: 3m
          R47_CONNECTED_ANDROID_FIXTURE_KILL_AFTER: 20s
          R47_CONNECTED_ANDROID_USE_DAEMON: 'true'
          R47_RELEASE_STORE_FILE: ${{ steps.release-keystore.outputs.keystore_path }}
          R47_RELEASE_STORE_PASSWORD: throwaway
          R47_RELEASE_KEY_ALIAS: verify
          R47_RELEASE_KEY_PASSWORD: throwaway
          R47_CONNECTED_ANDROID_TEST_CORE_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          R47_CONNECTED_ANDROID_TEST_SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          R47_CONNECTED_ANDROID_TEST_SOURCE_COMMIT: ${{ github.sha }}
          R47_CONNECTED_ANDROID_TEST_UPSTREAM_SOURCE_REPOSITORY_URL: ${{ steps.upstream.outputs.upstream_url }}
          R47_CONNECTED_ANDROID_TEST_UPSTREAM_SOURCE_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          R47_CONNECTED_ANDROID_TEST_XLSXIO_SOURCE_REPOSITORY_URL: ${{ steps.defaults.outputs.xlsxio_url }}
          R47_CONNECTED_ANDROID_TEST_XLSXIO_SOURCE_COMMIT: ${{ steps.defaults.outputs.xlsxio_commit }}
        with:
          api-level: ${{ steps.defaults.outputs.android_test_api_level }}
          target: default
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: ./android
          script: >-
            bash --noprofile --norc ../scripts/android/run_connected_android_tests.sh

  verify-published-artifacts:
    name: Verify published release artifacts
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve-release-inputs
      - build-production-release-bundle
      - sign-production-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/android/verify_published_release_artifacts.sh

      - name: Download published release APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-production-release-bundle.outputs.apk_artifact_name }}
          path: release-apk

      - name: Download published release AAB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-production-release-bundle.outputs.artifact_name }}
          path: release-aab

      - name: Verify published artifacts match recorded evidence
        shell: bash
        env:
          R47_VERSION_CODE_INPUT: ${{ needs.resolve-release-inputs.outputs.version_code }}
          R47_VERSION_NAME_INPUT: ${{ needs.resolve-release-inputs.outputs.version_name }}
          # Optional signer-identity pin. The release signing cert fingerprint is
          # public, so set it as a repository variable (not a secret) to assert
          # the published artifacts were signed by the expected key. Unset keeps
          # the signer self-consistency checks only.
          R47_RELEASE_EXPECTED_CERT_SHA256: ${{ vars.R47_RELEASE_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail

          # Single source of truth for the published ABI: the same default the
          # app library is built with. The published release APK carries only
          # this ABI; the x86_64-capable instrumentation build in
          # verify-production-release is a separate emulator vehicle, not the
          # published artifact, so the published bytes are verified here directly
          # against their recorded evidence.
          . ./android/r47-defaults.properties

          bash ./scripts/android/verify_published_release_artifacts.sh \
            --apk-evidence-dir release-apk \
            --aab-evidence-dir release-aab \
            --expected-version-code "$R47_VERSION_CODE_INPUT" \
            --expected-version-name "$R47_VERSION_NAME_INPUT" \
            --expected-apk-abis "$R47_DEFAULT_ANDROID_ABI_FILTERS" \
            --expected-signing-mode release

  publish-production-release:
    name: Publish production GitHub release
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve-release-inputs
      - build-production-release-bundle
      - sign-production-release
      - verify-production-release
      - verify-published-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # SLSA build-provenance attestation needs an OIDC token to sign and write
      # access to the attestations store.
      id-token: write
      attestations: write
    steps:
      - name: Download release AAB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-production-release-bundle.outputs.artifact_name }}
          path: release-aab

      - name: Download release APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-production-release-bundle.outputs.apk_artifact_name }}
          path: release-apk

      - name: Attest build provenance for the published artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Attest the exact signed bytes that ship on the GitHub release, so a
          # consumer can verify they were produced by THIS workflow, not merely
          # somewhere in this repo:
          #   gh attestation verify <file> --repo ${{ github.repository }} \
          #     --signer-workflow ${{ github.repository }}/.github/workflows/android-release.yml
          subject-path: |
            release-apk/*.apk
            release-aab/*.aab

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/android-release.yml
        shell: bash
        run: |
          set -euo pipefail

          # Re-verify the attestation just produced for each shipped artifact, so
          # a broken, unsigned, or missing provenance fails the release in the
          # same run instead of being discovered after publication. Bind to this
          # workflow's identity so an attestation produced by any OTHER workflow
          # in the repo cannot satisfy the check.
          for artifact in release-apk/*.apk release-aab/*.aab; do
            echo "Verifying build provenance for ${artifact}"
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${SIGNER_WORKFLOW}"
          done

      - name: Pack release evidence archives
        id: evidence
        shell: bash
        run: |
          set -euo pipefail

          aab_name=$(sed -n 's/^artifact_name=//p' release-aab/BUILD-METADATA.txt)
          apk_name=$(sed -n 's/^artifact_name=//p' release-apk/BUILD-METADATA.txt)

          if [[ -z "$aab_name" || -z "$apk_name" ]]; then
            echo "Release build metadata did not contain both artifact names." >&2
            exit 1
          fi

          # Disambiguate by artifact type: stripping only the extension would
          # collapse both to the same "<stem>-release-packaging-evidence.zip"
          # name (the APK and AAB share the "<stem>-release" prefix), which
          # silently overwrote one archive on upload and listed the same file
          # twice in the release notes.
          aab_evidence_archive_name="${aab_name%.aab}-aab-packaging-evidence.zip"
          apk_evidence_archive_name="${apk_name%.apk}-apk-packaging-evidence.zip"

          rm -f "release-aab/${aab_evidence_archive_name}" "release-apk/${apk_evidence_archive_name}"
          (
            cd release-aab
            zip -qr "$aab_evidence_archive_name" \
              BUILD-METADATA.txt \
              PACKAGED-COMPLIANCE-ASSETS.txt \
              SHA256SUMS.txt \
              mapping.txt \
              native-debug-symbols.zip \
              compliance-assets
          )
          (
            cd release-apk
            zip -qr "$apk_evidence_archive_name" \
              BUILD-METADATA.txt \
              PACKAGED-COMPLIANCE-ASSETS.txt \
              SHA256SUMS.txt \
              abis.txt \
              zipalign.txt \
              elf-load-segments.txt \
              mapping.txt \
              native-debug-symbols.zip \
              compliance-assets
          )

          echo "aab_evidence_archive_name=${aab_evidence_archive_name}" >> "$GITHUB_OUTPUT"
          echo "apk_evidence_archive_name=${apk_evidence_archive_name}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        env:
          R47_RELEASE_MODE: ${{ needs.resolve-release-inputs.outputs.release_mode }}
        run: |
          set -euo pipefail

          upstream_commit=$(sed -n 's/^upstream_commit=//p' release-aab/BUILD-METADATA.txt)
          upstream_url=$(sed -n 's/^upstream_url=//p' release-aab/BUILD-METADATA.txt)
          android_commit=$(sed -n 's/^android_source_commit=//p' release-aab/BUILD-METADATA.txt)
          version_name=$(sed -n 's/^version_name=//p' release-aab/BUILD-METADATA.txt)
          version_code=$(sed -n 's/^version_code=//p' release-aab/BUILD-METADATA.txt)
          xlsxio_commit=$(sed -n 's/^xlsxio_commit=//p' release-aab/BUILD-METADATA.txt)
          xlsxio_url=$(sed -n 's/^xlsxio_url=//p' release-aab/BUILD-METADATA.txt)
          aab_name=$(sed -n 's/^artifact_name=//p' release-aab/BUILD-METADATA.txt)
          apk_name=$(sed -n 's/^artifact_name=//p' release-apk/BUILD-METADATA.txt)
          upstream_short_commit="${upstream_commit:0:8}"
          android_short_commit="${android_commit:0:8}"

          cat > release-notes.md <<EOF
          - Release tag ${{ needs.build-production-release-bundle.outputs.release_tag }}
          - Android version ${version_name} (${version_code})
          - Sync to commit [${upstream_short_commit}](${upstream_url}/-/commit/${upstream_commit})
          - Build Android overlay commit [${android_short_commit}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${android_commit})

          This release contains the signed production APK ${apk_name} for direct
          installation and the signed production AAB ${aab_name} for Play
          Console upload.

          The release workflow built these assets from the upstream core above
          through the wrapper-owned host-core optimization flow, and checked
          their signer, version, ABIs, and checksums before publishing them.
          Android lint, the release-path JVM tests, and the release-path
          instrumentation tests ran on an emulator against a rebuild of the same
          commit that is not minified and is signed with a throwaway key, not
          against these exact bytes.

          The Linux host toolchain built xlsxio_xlsx2csv from ${xlsxio_url} at
          commit ${xlsxio_commit} to satisfy the upstream font-generation
          contract.

          Included assets:
          - ${apk_name}
          - ${aab_name}
          - ${{ steps.evidence.outputs.apk_evidence_archive_name }}
          - ${{ steps.evidence.outputs.aab_evidence_archive_name }}

          Notes:
          - This GitHub release was published from the ${R47_RELEASE_MODE} signed
            release lane.
          - The APK is the GitHub-distributed installable artifact for direct
            sideload updates.
          - The AAB is the Play Console upload artifact.
          - If Google Play later distributes builds signed by a different
            Play-held app-signing key, switching from this GitHub APK channel to
            Play delivery can still require reinstall.
          - The evidence archives preserve compliance assets, source provenance,
            signing metadata, and release packaging reports.

          Workflow run:
          https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Create and publish production release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build-production-release-bundle.outputs.release_tag }}
          name: ${{ needs.build-production-release-bundle.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            release-apk/*.apk
            release-aab/*.aab
            release-apk/${{ steps.evidence.outputs.apk_evidence_archive_name }}
            release-aab/${{ steps.evidence.outputs.aab_evidence_archive_name }}
          fail_on_unmatched_files: true
          # Only replace assets on an existing tag when the dispatch explicitly
          # asked for a re-cut; the resolve-release-inputs guard already fails a
          # non-overwrite run whose tag exists, so this is the second half of the
          # same contract at the actual publish point.
          overwrite_files: ${{ inputs.allow_overwrite }}
          prerelease: false
          draft: false
          make_latest: true
