name: Pages

# Publishes the GitHub Pages site as one artifact, because a deploy replaces the
# whole site: two workflows would erase each other's pages.
#
# The home page, android/site/index.html, as https://ppigazzini.github.io/r47zen/,
# with the launcher icon's drawing source, android/app/icon-source/r47zen.svg, as
# its logo and favicon. scripts/docs/stage_pages_home.sh stages both after the
# policy and the manual, and refuses a page whose link into the site names no
# staged file, or that loads anything from another origin or runs a script;
# run_pages_home_contract.sh holds the script and this workflow to that.
#
# The calculator screens the home page shows, as screens/<scene>.svg, one per
# scene scripts/site-screens/scenes.txt lists, drawn by the upstream core the run
# resolves whenever the site deploys. The screens job builds and runs that core,
# so it holds no write permission and no secret, and the build job refuses any
# file but the SVGs in the shape site_screens.c writes (check_screens_artifact.sh).
# When the render fails, the live screens go out again and the run stays red, so
# a broken render does not hold back the policy; run_site_screens_contract.sh
# holds the scripts and this workflow to that.
#
# The privacy policy the app ships,
# android/app/src/main/assets/privacy-policy.html, unchanged, as
# https://ppigazzini.github.io/r47zen/privacy-policy.html, the URL in Play
# Console's privacy-policy field. The page the app shows and the page Play
# links to are one file, so they cannot drift;
# run_privacy_policy_single_source_contract.sh holds this workflow to that
# file.
#
# Upstream's cropped manual, as
# https://ppigazzini.github.io/r47zen/manual/C47_R47_calc_Crop.pdf, the URL the app
# opens. scripts/docs/prepare_manual_site.sh builds it from upstream HEAD when its
# inputs change; run_manual_site_contract.sh holds both to that URL. When a build fails
# outside the nightly run, the live PDF goes out again and the run stays red, so a
# broken manual does not hold back the policy.
#
# The deployment is the Actions-based Pages flow: an uploaded artifact, no
# gh-pages branch.
#
# One-time setup: Settings, Pages, Build and deployment, Source "GitHub
# Actions". GitHub then creates the github-pages environment, whose
# deployment branch policy admits main only, so the deploy job runs only there;
# a dispatch on another branch stops before it, and builds only if an input differs.
on:
  push:
    branches:
      - main
    paths:
      - android/app/src/main/assets/privacy-policy.html
      - android/site/index.html
      - android/app/icon-source/r47zen.svg
      - .github/workflows/privacy-policy-pages.yml
      - scripts/docs/prepare_manual_site.sh
      - scripts/docs/stage_pages_home.sh
      - scripts/site-screens/**
  schedule:
    - cron: '54 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; never cancel a publish already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve-upstream-core:
    name: Resolve authoritative upstream core revision
    uses: ./.github/workflows/resolve-upstream-core.yml
    with:
      mode: latest

  # Runs upstream's Makefile, whose TeX can run commands, so it holds no write
  # permission and no secret, and the container gets no network.
  manual:
    name: Prepare the cropped manual
    needs: resolve-upstream-core
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.prepare.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hydrate upstream
        shell: bash
        env:
          UPSTREAM_URL: ${{ needs.resolve-upstream-core.outputs.upstream_url }}
          UPSTREAM_COMMIT: ${{ needs.resolve-upstream-core.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          bash ./scripts/upstream-sync/upstream.sh sync --auto --write-lock \
            --url "$UPSTREAM_URL" --commit "$UPSTREAM_COMMIT"

      - name: Prepare the manual
        id: prepare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bash ./scripts/docs/prepare_manual_site.sh _manual "$EVENT_NAME" >>"$GITHUB_OUTPUT"

      - name: Upload the manual
        if: ${{ always() && steps.prepare.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual
          path: _manual
          if-no-files-found: error
          retention-days: 1

  # Builds and runs the upstream core on the host, so it holds no write
  # permission and no secret. It renders only for a run that deploys: a nightly
  # run that finds the manual current deploys nothing, so the screens follow
  # upstream only as often as the site deploys.
  screens:
    name: Render the calculator screens
    needs:
      - resolve-upstream-core
      - manual
    if: ${{ always() && needs.manual.outputs.deploy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.render.outcome == 'success' || steps.fallback.outcome == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load shared Android defaults
        id: defaults
        shell: bash
        run: |
          set -euo pipefail
          . ./android/r47-defaults.properties
          echo "xlsxio_url=$R47_DEFAULT_XLSXIO_URL" >> "$GITHUB_OUTPUT"
          echo "xlsxio_commit=$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"
          echo "xlsxio_prefix=$HOME/.cache/r47/xlsxio/$R47_DEFAULT_XLSXIO_COMMIT" >> "$GITHUB_OUTPUT"
          echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
          echo "build_jdk_version=$R47_DEFAULT_ANDROID_BUILD_JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$R47_DEFAULT_ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "cmake_version=$R47_DEFAULT_ANDROID_CMAKE_VERSION" >> "$GITHUB_OUTPUT"
          echo "compile_sdk=$R47_DEFAULT_ANDROID_COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "compile_sdk_minor=$R47_DEFAULT_ANDROID_COMPILE_SDK_MINOR" >> "$GITHUB_OUTPUT"
          echo "build_tools_version=$R47_DEFAULT_ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        shell: bash
        run: bash ./scripts/android/install_linux_build_deps.sh

      # gh actions-lock does not follow a ./ action, so these never-run steps record
      # the actions setup-xlsxio-toolchain and setup-android-sdk run; actionlint
      # refuses if: false.
      - name: Lock the action the xlsxio composite runs
        if: github.event_name == 'never'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: never
          key: never

      - name: Lock the action the SDK composite runs
        if: github.event_name == 'never'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up xlsxio toolchain
        uses: ./.github/actions/setup-xlsxio-toolchain
        with:
          url: ${{ steps.defaults.outputs.xlsxio_url }}
          commit: ${{ steps.defaults.outputs.xlsxio_commit }}
          prefix: ${{ steps.defaults.outputs.xlsxio_prefix }}
          jobs: ${{ steps.defaults.outputs.jobs }}

      - name: Hydrate upstream
        shell: bash
        env:
          UPSTREAM_URL: ${{ needs.resolve-upstream-core.outputs.upstream_url }}
          UPSTREAM_COMMIT: ${{ needs.resolve-upstream-core.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          bash ./scripts/upstream-sync/upstream.sh sync --auto --write-lock \
            --url "$UPSTREAM_URL" --commit "$UPSTREAM_COMMIT"
          bash ./scripts/upstream-sync/hydrate_submodules.sh "$UPSTREAM_COMMIT" "$UPSTREAM_URL"

      # The device half of the render runs the app's JVM test SiteDeviceSvgTest,
      # so it needs the JDK and the SDK android-ci builds with.
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.defaults.outputs.build_jdk_version }}

      # Read android-ci's Gradle cache, keyed as it keys it; this job runs the
      # upstream core, so it saves no cache another job would restore.
      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties', 'android/gradle/*.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk
        with:
          compile-sdk: ${{ steps.defaults.outputs.compile_sdk }}
          compile-sdk-minor: ${{ steps.defaults.outputs.compile_sdk_minor }}
          build-tools-version: ${{ steps.defaults.outputs.build_tools_version }}
          cmake-version: ${{ steps.defaults.outputs.cmake_version }}
          ndk-version: ${{ steps.defaults.outputs.ndk_version }}

      - name: Render the screens
        id: render
        shell: bash
        run: bash ./scripts/site-screens/render_site_screens.sh _screens

      # A Pages deploy replaces the whole site, so a run that cannot render
      # republishes the live screens rather than hold back the policy.
      - name: Fetch the live screens
        id: fallback
        if: ${{ always() && steps.render.outcome != 'success' }}
        shell: bash
        run: bash ./scripts/site-screens/fetch_live_screens.sh _screens

      - name: Upload the screens
        if: ${{ always() && (steps.render.outcome == 'success' || steps.fallback.outcome == 'success') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: _screens
          if-no-files-found: error
          retention-days: 1

  build:
    name: Stage the site
    needs:
      - manual
      - screens
    if: ${{ always() && needs.manual.outputs.deploy == 'true' && needs.screens.outputs.ready == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the manual
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manual
          path: _site/manual

      # The manual job ran upstream's TeX with -shell-escape, so its artifact is
      # steered by an upstream commit; publish the PDF and its VERSION, nothing else.
      - name: Refuse anything but the PDF and its VERSION
        shell: bash
        run: bash ./scripts/docs/check_manual_artifact.sh _site/manual

      - name: Download the screens
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screens
          path: _site/screens

      # The screens job ran the upstream core, so its artifact is steered by an
      # upstream commit; publish the scenes' SVGs in the shape site_screens.c
      # writes, nothing else.
      - name: Refuse anything but the screens' SVGs
        shell: bash
        run: bash ./scripts/site-screens/check_screens_artifact.sh _site/screens

      - name: Stage the privacy policy
        shell: bash
        # cp fails the job when the asset is missing, so a move that skips
        # this workflow never publishes an empty site.
        run: |
          cp android/app/src/main/assets/privacy-policy.html _site/privacy-policy.html

      - name: Stage the home page
        shell: bash
        run: bash ./scripts/docs/stage_pages_home.sh _site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # deploy-pages publishes the artifact and mints the OIDC token Pages verifies.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
