# Keep dependencies current across every ecosystem this repo owns. Manual pins
# go stale silently, so Dependabot proposes the bump on a weekly cadence for
# review. Each ecosystem groups its updates into one PR to keep the review
# surface small.
#
# - github-actions: the workflows pin every third-party action to a full commit
#   SHA with a reviewed `# vX.Y.Z` comment; Dependabot proposes the SHA + comment
#   bump. The `/` directory scan also covers the composite actions under
#   `.github/actions/**`.
# - gradle: the Android app dependencies and AGP/plugin versions, so a
#   vulnerable transitive library surfaces as a PR instead of shipping silently.
# - uv: the maintained Python contract/tooling deps in `pyproject.toml`.
# - pre-commit: the hook revs in `.pre-commit-config.yaml`. A rev that Shell
#   Lint or uv.lock also pins fails run_action_pin_consistency_contract.sh
#   until the pull request moves the other copy too.
#
# Every ecosystem waits 7 days after a release before proposing it, so a
# compromised release that is pulled within the week never reaches a pull
# request. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      gradle:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      pre-commit:
        patterns:
          - "*"
