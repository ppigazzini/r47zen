# Keep dependencies current: manual pins go stale silently, so Dependabot
# proposes each bump on a weekly cadence for review. Each ecosystem groups its
# updates into one PR to keep the review surface small.
#
# - github-actions: the workflows pin every third-party action to a full commit
#   SHA with a reviewed `# vX.Y.Z` comment; Dependabot proposes the SHA + comment
#   bump. The `/` directory scan also covers the composite actions under
#   `.github/actions/**`.
# - gradle: the Android app dependencies and AGP/plugin versions, so a
#   vulnerable transitive library surfaces as a PR instead of shipping silently.
# - pre-commit: the hook revs in `.pre-commit-config.yaml`. A rev that Shell
#   Lint, uv.lock, or a setup-uv step (the uv-pre-commit rev) also pins fails
#   run_action_pin_consistency_contract.sh until the pull request moves the
#   other copy too.
#
# uv has no entry, so `pyproject.toml` and `uv.lock` move by hand alone.
# Dependabot's updater installs Python 3.10 to 3.14 and stops with
# tool_version_not_supported on a requires-python floor of 3.15. Restore the
# entry once its updater lists 3.15;
# android/docs/dev/07-ci-and-release-workflow.md says how to check.
#
# Every ecosystem waits 7 days after a release before proposing it, so a
# compromised release that is pulled within the week never reaches a pull
# request. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      gradle:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      pre-commit:
        patterns:
          - "*"
