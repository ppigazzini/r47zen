[project]
name = "r47-internal-python-tools"
version = "0.0.0"
requires-python = ">=3.15"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "fontTools>=4.68.0",
    # The contract-data schemas: valgebra validates each JSON input against its
    # declared shape at load. valgebra has no runtime dependency and reads the
    # annotated-types markers structurally, so _contract_data.py, which spells
    # its refinements as `at.Gt` and `at.MinLen`, depends on annotated-types
    # itself. The PEP 728 `closed=True` TypedDict the schemas declare is stdlib
    # `typing` from 3.15.
    "valgebra>=0.0.22",
    "annotated-types>=0.8.0",
]

[tool.ruff]
target-version = "py315"
src = ["scripts"]

[tool.ruff.lint]
select = ["ALL"]
# `select = ["ALL"]` opts every newly stabilized rule in on the next ruff bump,
# which is deliberate: a new rule should surface as a lint failure to triage,
# not stay silent. CPY001 is the one standing exception. It wants a per-file
# copyright header; this repo states its license once in COPYING and carries no
# per-file headers, so the rule contradicts an existing project convention
# rather than finding a defect. Stabilized in ruff 0.16.0.
ignore = ["CPY001"]

[tool.ruff.lint.flake8-type-checking]
# valgebra reads a TypedDict's annotations at `Validator(...)` time through
# `get_type_hints`, so every class a field names must still be imported at
# runtime; without this entry TC001-TC003 would move such an import under
# `if TYPE_CHECKING:` and the schema build would raise NameError.
runtime-evaluated-base-classes = ["typing.TypedDict"]

[tool.ty.environment]
python-version = "3.15"
